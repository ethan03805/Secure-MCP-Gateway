# Desktop Application (E-34, SRS FR-20). Direct dependencies are pinned to
# exact versions that were at least two weeks old when chosen; Cargo.lock
# is committed. The Tauri updater and shell plugins are deliberately absent
# (FR-20.13, SR-2-5): updates are verified with the release key, and the
# application runs only fixed argument vectors through std::process.
[package]
name = "smcp-desktop"
version = "0.1.0"
description = "Secure MCP Gateway desktop application (tray, service control, console window)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "smcp_desktop"
crate-type = ["rlib"]

[[bin]]
name = "smcp-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
url = "=2.5.8"
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
# Update check and download (FR-20.11, FR-20.13): HTTPS with the operating
# system's trust store, no cookies, no compression. Release verification
# (SR-7-2): minisign signatures, SHA-256 and release version ordering.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
minisign-verify = "=0.2.5"
ring = "=0.17.14"
semver = "=1.0.28"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSURLAuthenticationChallenge", "NSURLProtectionSpace", "NSURLCredential", "NSURLSession", "NSArray", "NSData"] }
objc2-security = { version = "=0.3.2", features = ["SecTrust", "SecCertificate", "SecBase"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFArray", "CFData"] }

# Approval notifications that open the Approvals view when clicked
# (FR-20.7); the version tauri-plugin-notification already uses.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
notify-rust = "=4.18.1"

# Windows (FR-20.1): the WebView2 certificate hook of SR-2.8-5, the User
# Account Control start of the machine-mode service control (FR-20.3,
# SR-2-7) and approval toasts that open the Approvals view (FR-20.7). The
# versions wry and tauri-plugin-notification already use.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Wdk_System_Threading"] }
tauri-winrt-notification = "=0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# Signs the throwaway test release feed (never the release key).
minisign = { version = "=0.9.1", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
