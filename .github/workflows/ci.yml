# Continuous integration. The job names srs, go, lint, site, security,
# linux-integration and console are required status checks on main;
# renaming one breaks branch protection, so keep them stable (a job
# skipped by its if: reports its name unevaluated, so these names must stay
# literal). Do not add paths-ignore to this workflow: a
# required check that never reports blocks the pull request. Pull requests
# that change only documentation skip heavy jobs through the changes job
# instead (docs/ci.md); a new heavy job gets the same needs: and if: as
# hostile. Pull request runs are staged: the heavy jobs run only after srs
# and lint pass, and not at all on drafts (docs/ci.md, "Staged pull request
# runs and draft pull requests").
#
# Triggers: pull requests, pushes to main, pushes of release tags (v*) and
# workflow_dispatch. The dispatch trigger exists because commits pushed with
# GITHUB_TOKEN (by the regenerate and auto-update workflows) do not start
# workflows; those workflows dispatch CI on the PR branch so the required
# checks run on the new head commit.
#
# The jobs perf, acceptance-enforced, console-enforced and offline run on
# every trigger except pull requests: on pushes to main, on release tags and
# when dispatched. Their results are what the release label of FR-19.3
# counts; the status job writes the status document of every such run (the
# artifact status-document) and publishes it to site-data for main only.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Which areas a pull request changes (docs/ci.md). Pull requests that
  # change only Markdown documentation, srs_build/ or site/ skip the heavy
  # jobs below; a job skipped by its if: reports "skipped", which satisfies
  # a required check. Every other trigger runs everything (heavy=true,
  # go=full), and so does any job whose changes job did not succeed.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      go: ${{ steps.classify.outputs.go }}
      desktop: ${{ steps.classify.outputs.desktop }}
      # macOS runners are scarce (docs/ci.md, "macOS runners"): on pull
      # requests the macOS legs run only when they can be affected.
      macos-pkg: ${{ steps.classify.outputs.macos-pkg }}
      install-os: ${{ steps.classify.outputs.install-os }}
      desktop-matrix: ${{ steps.classify.outputs.desktop-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # heavy: true runs every job; false skips linux-integration,
          # install-standalone, console, graph and hostile.
          # go: full (race, coverage), light (no race, no coverage: the Go
          # tests read docs/, the root Markdown files, srs_build/ and
          # site/data/) or skip (site/ only).
          # desktop: true runs the desktop job (desktop/, Go code, go.mod,
          # go.sum, tools/reqreport, this workflow); a pull request that
          # changes only desktop/ runs neither the heavy jobs nor go.
          # macOS (pull requests only; every other trigger runs all of them):
          #   macos_pkg: the .pkg smoke test of installers.yml, when the
          #     .pkg can change (packaging/installers/macos/, the installer
          #     workflows and scripts, .goreleaser.yaml, Go code that builds
          #     for darwin: not *_test.go, *_linux.go, *_windows.go).
          #   macos_install: the macOS legs of install-standalone and
          #     install-guide (Go code for darwin and its tests, install.sh,
          #     docs/install.md, their scripts).
          #   macos_desktop: the macOS leg of desktop (desktop/,
          #     tools/reqreport).
          #   Changing this workflow runs all of them.
          heavy=true go=full desktop=true
          macos_pkg=true macos_install=true macos_desktop=true
          # A pull_request run checks out the merge commit of the head into
          # the current base: HEAD^1 is the base, so the diff is exactly what
          # merging the pull request changes.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null &&
             files=$(git -c core.quotePath=false diff --no-renames --name-only 'HEAD^1' HEAD) && [ -n "$files" ]; then
            heavy=false go=skip desktop=false
            macos_pkg=false macos_install=false macos_desktop=false
            while IFS= read -r f; do
              case "$f" in
                desktop/* | *.go | go.mod | go.sum | tools/reqreport/* | .github/workflows/ci.yml) desktop=true ;;
              esac
              case "$f" in
                *_linux.go | *_linux_test.go | *_windows.go | *_windows_test.go) ;;
                *_test.go) macos_install=true ;;
                *.go | go.mod | go.sum) macos_install=true macos_pkg=true ;;
                packaging/installers/macos/* | .github/workflows/installers.yml | .github/workflows/installers-macos-smoke.yml | \
                  scripts/package-smoke.sh | scripts/install-pkg-tools.sh | .goreleaser.yaml) macos_pkg=true ;;
                install.sh | docs/install.md | scripts/ci-install-guide.sh | scripts/ci-install-standalone.sh) macos_install=true ;;
                desktop/* | tools/reqreport/*) macos_desktop=true ;;
                .github/workflows/ci.yml) macos_pkg=true macos_install=true macos_desktop=true ;;
              esac
              case "$f" in
                desktop/*) ;;
                site/data/*) [ "$go" = full ] || go=light ;;
                site/*) ;;
                docs/*.md | srs_build/*) [ "$go" = full ] || go=light ;;
                */*) heavy=true go=full ;;
                *.md) [ "$go" = full ] || go=light ;;
                *) heavy=true go=full ;;
              esac
            done <<<"$files"
            { echo "Changed files:"; echo '```'; echo "$files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          install_os='["ubuntu-24.04"]'
          [ "$macos_install" = true ] && install_os='["ubuntu-24.04","macos-26"]'
          desktop_matrix='[{"os":"ubuntu-24.04","platform":"linux"}]'
          [ "$macos_desktop" = true ] && desktop_matrix='[{"os":"macos-15","platform":"macos"},{"os":"ubuntu-24.04","platform":"linux"}]'
          {
            echo "heavy=$heavy"; echo "go=$go"; echo "desktop=$desktop"; echo "macos-pkg=$macos_pkg"
            echo "install-os=$install_os"; echo "desktop-matrix=$desktop_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy go=$go desktop=$desktop macos_pkg=$macos_pkg macos_install=$macos_install macos_desktop=$macos_desktop"
          echo "**heavy=$heavy go=$go desktop=$desktop macos_pkg=$macos_pkg macos_install=$macos_install macos_desktop=$macos_desktop** (docs/ci.md)" >> "$GITHUB_STEP_SUMMARY"

  srs:
    name: srs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate the SRS from srs_build and compare with the committed file
        run: |
          python3 -I srs_build/gen.py . "$RUNNER_TEMP/srs.md"
          if ! diff -u Secure_MCP_Gateway_SRS.md "$RUNNER_TEMP/srs.md"; then
            echo "::error file=Secure_MCP_Gateway_SRS.md::The committed SRS differs from srs_build. Run: python3 -I srs_build/gen.py . Secure_MCP_Gateway_SRS.md"
            exit 1
          fi

  go:
    name: go
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.go != 'skip') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            spikes/*/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            git ls-files -z '*.go' | xargs -0 gofmt -d
            exit 1
          fi
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error file=go.mod::go.mod or go.sum is not tidy. Run: go mod tidy"
            exit 1
          fi
      - name: Pinned pyarrow, pandas and NetworkX for the export check (FR-10.34)
        run: |
          python3 -m venv "$RUNNER_TEMP/pyload"
          "$RUNNER_TEMP/pyload/bin/pip" install --no-cache-dir -r internal/research/testdata/pyload/requirements.txt
          echo "SMCP_RESEARCH_PYTHON=$RUNNER_TEMP/pyload/bin/python" >> "$GITHUB_ENV"
      # go=light (a pull request that changes only documentation, the SRS
      # or site data; docs/ci.md): every test, without -race and coverage.
      - name: Test (race, coverage) and map results to requirement IDs (FR-12.10)
        id: test
        env:
          GO_MODE: ${{ needs.changes.outputs.go }}
          # FR-12.7: the smcpctl subcommand steps of TestAdminCLIDemonstration.
          SMCP_ADMIN_CLI_EVIDENCE: ${{ github.workspace }}/build/admin-cli
        run: |
          mkdir -p build
          rc=0
          if [ "$GO_MODE" = light ]; then
            go test -json ./... > build/go-test.json || rc=$?
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
            go run ./tools/reqreport -in build/go-test.json
          else
            go test -race -json -coverpkg=./... -coverprofile=build/cover.out ./... > build/go-test.json || rc=$?
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
            go run ./tools/reqreport -in build/go-test.json -coverprofile build/cover.out
          fi
          cat build/reqreport.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Output of failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: |
          jq -r -s '
            map(select(.Test != null)) | group_by(.Package + " " + .Test)
            | map(select(any(.[]; .Action == "fail")))
            | .[] | "--- FAIL: \(.[0].Package) \(.[0].Test)", (map(select(.Action == "output") | .Output) | join(""))
          ' build/go-test.json
          jq -r 'select(.Test == null and .Action == "output") | .Output' build/go-test.json | grep -v '^ok \|^?\|^PASS$' || true
      - name: Upload test results and status document
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-results
          path: |
            build/reqreport.json
            build/reqreport.md
            build/status.json
            build/go-test.json
            build/cover.out
            build/admin-cli/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Spike modules still build
        run: |
          for d in spikes/*/; do
            (cd "$d" && go vet ./... && go test ./...)
          done

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: UI string lint (docs/design/writing.md)
        run: go run ./tools/uilint

  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ hashFiles('site/src/**', '*.md') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: site
      - name: Typecheck
        run: npx --no-install tsc --noEmit
        working-directory: site
      - name: Unit tests
        run: npm test
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - name: Check pages and internal links
        run: npm run check-out
        working-directory: site
      # The runner image's Google Chrome through playwright-core; no browser download.
      - name: Check that every diagram and chart fits its box (1280 and 390 px)
        run: npm run check-diagrams
        working-directory: site

  # security has the same needs as the heavy jobs, so on a pull request
  # GitHub creates it in the same step as them. A job that waits for its
  # needs has no check run yet, while the skipped go, linux-integration and
  # console of the earlier draft run of the same commit still satisfy
  # branch protection; the pending required security check keeps the pull
  # request blocked until the new heavy checks exist (docs/ci.md, "Staged
  # pull request runs and draft pull requests"). It runs on drafts and when
  # srs or lint failed.
  security:
    name: security
    needs: [changes, srs, lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high and critical, with the reviewed allowlist)
        run: scripts/npm-audit-gate.sh site
      - name: Secret scan of the new commits (trufflehog)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

  linux-integration:
    name: linux-integration
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Install minisign (signs the upgrade test releases)
        run: command -v minisign >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq minisign; }
      # The Go tests these scripts run against real rootless Podman and in a
      # network namespace skip in the go job; their events go to
      # build/linux-integration-test.json, which the status job merges.
      - name: Bootstrap, run smcpd, drive an MCP client, verify the journal
        env:
          SMCP_ITEST_DIR: ${{ runner.temp }}/itest
          SMCP_REQUIRE_PREREQS: "1"
          SMCP_ITEST_RESULTS: ${{ github.workspace }}/build/linux-integration-test.json
        run: |
          mkdir -p build
          scripts/ci-integration.sh
      - name: Egress broker and remote host rules in network namespaces (direct egress blocked, brokered egress allowed; SR-4.14-1)
        env:
          SMCP_ITEST_DIR: ${{ runner.temp }}/egress
          SMCP_ITEST_RESULTS: ${{ github.workspace }}/build/linux-integration-test.json
        run: scripts/ci-egress-netns.sh
      - name: Upload the results of the Go tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-integration-results
          path: build/linux-integration-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the smcpd log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-integration-log
          path: ${{ runner.temp }}/itest/smcpd.log
          if-no-files-found: ignore
          retention-days: 7

  # smcpctl install in the Standalone profile with the runner's own service
  # manager (FR-13.6, FR-13.4): a systemd user unit on Ubuntu (with Podman
  # removed: FR-13.6 asks for a Linux runner without it), a launchd user
  # agent on macOS (arm64); install twice, check the service and health,
  # then uninstall. The Go test that runs it writes its events to
  # build/install-standalone-<os>-test.json for the status job. Not a
  # required check. The macOS leg runs on pull requests only when
  # changes.outputs.install-os lists it (docs/ci.md, "macOS runners").
  install-standalone:
    name: install-standalone (${{ matrix.os }})
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.install-os || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Remove Podman (FR-13.6, a Linux runner without Podman)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove -y -qq podman >/dev/null 2>&1 || true
          if command -v podman; then echo "::error::podman is still installed"; exit 1; fi
      - name: smcpctl install, second install, uninstall (TestInstallStandaloneServiceManager)
        env:
          SMCP_INSTALL_SERVICE_TEST: "1"
        run: |
          set -o pipefail
          mkdir -p build
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          go test -json -count=1 -run '^TestInstallStandaloneServiceManager$' ./cmd/smcpctl \
            | tee "build/install-standalone-$os-test.json" | jq -rj 'select(.Action == "output") | .Output'
      - name: Upload the results of the Go test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-standalone-results-${{ matrix.os }}
          path: build/install-standalone-*-test.json
          if-no-files-found: warn
          retention-days: 14

  # The install guide followed as written (FR-18.1): the walkthrough
  # blocks of docs/install.md, run unchanged by scripts/ci-install-guide.sh
  # (Standalone on clean macOS arm64 and Ubuntu runners, then Enforced on
  # Ubuntu: install.sh v1.0.0, smcpctl install, upgrade to v1.1.0,
  # uninstall). It
  # fails when the guide drifts from what works. The Go test writes its
  # events to build/install-guide-<os>-test.json for the status job. Not a
  # required check. Runs on every trigger; the macOS leg runs on pull
  # requests only when changes.outputs.install-os lists it (docs/ci.md,
  # "macOS runners").
  install-guide:
    name: install-guide (${{ matrix.os }})
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.install-os || '["ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Follow the install guide (TestInstallGuideWalkthrough)
        env:
          SMCP_INSTALL_GUIDE_TEST: "1"
        run: |
          set -o pipefail
          mkdir -p build
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          go test -json -count=1 -timeout 15m -run '^TestInstallGuideWalkthrough$' ./cmd/smcpctl \
            | tee "build/install-guide-$os-test.json" | jq -rj 'select(.Action == "output") | .Output'
      - name: Upload the results of the Go test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-guide-results-${{ matrix.os }}
          path: build/install-guide-*-test.json
          if-no-files-found: warn
          retention-days: 14

  # Windows (FR-21.2, FR-21.19, planned for v1.3.0; docs/windows-port.md).
  # Not a required check. Builds every package for windows/amd64 and
  # windows/arm64 with CGO_ENABLED=0 (the release setting, FR-21.18), runs
  # go vet for Windows, runs the unit tests of the packages listed in
  # WINDOWS_TEST_PACKAGES and fails when one of them fails. The last step
  # runs every package once more, records the per-package result in the
  # step summary and never fails the job: it measures the port.
  windows:
    name: windows
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      # The Go tests compare files byte for byte; keep LF line endings.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Build (windows/amd64, windows/arm64)
        run: |
          go build ./...
          GOARCH=arm64 go build ./...
      - name: Vet
        run: go vet ./...
      # Packages whose tests pass on Windows today (measured 2026-10-18,
      # docs/windows-port.md). Every other package with tests is excluded
      # until its port lands; the reason per package:
      #   smcpd start refused by keys.CheckPrivate (FR-21.5, FR-21.10):
      #     internal/app, internal/e2e, internal/remote, internal/conformance,
      #     internal/adapter, cmd/smcpctl (also: binaries built without .exe)
      #   POSIX fixture paths such as "/inproc/t" that are not absolute on
      #     Windows: internal/backend, internal/edge, internal/filters,
      #     internal/pipeline (its TestWindows* tests run in the next step)
      #   Linux sandbox (fake Podman uses syscall.Exec): internal/sandbox
      #   POSIX file-mode checks in code or tests (FR-21.5):
      #     internal/secrets, internal/graph, internal/obsstore,
      #     internal/baseline, internal/principals, internal/diag,
      #     internal/obspolicy, internal/research, internal/approval,
      #     internal/harness, scripts/agents
      #   Windows paths written into TOML basic strings by the tests:
      #     internal/adminapi, internal/consoleauth, internal/filterapi,
      #     internal/openapi, tools/openapi
      #   POSIX default paths (/usr/bin/podman, sudo): internal/config,
      #     internal/packaging (also: no .exe, launch refused)
      #   POSIX path canonicalization of the request filters (FR-21.25):
      #     internal/policy, internal/filters
      #   tools absent on Windows (sh, nft): tools/installsh, internal/tunnel
      #   binaries built without .exe: cmd/smcpd, cmd/smcp-refserver
      #   timing on a shared runner: internal/perf
      # The TestWindows* tests of internal/pipeline and internal/edge check
      # that unported features fail closed; those of internal/keys,
      # internal/winsec, internal/durable and internal/health check the
      # DACL, DPAPI, write-through and free-space ports (FR-21.5, FR-21.10,
      # FR-21.23, FR-21.26).
      - name: Test the packages that pass on Windows, and the fail-closed gates
        env:
          WINDOWS_TEST_PACKAGES: >-
            ./cmd/smcp-hostile ./docs ./internal/acceptance ./internal/analytics
            ./internal/anomaly ./internal/audit ./internal/authguard
            ./internal/backup ./internal/cachestats ./internal/consoleapi
            ./internal/contextforge ./internal/durable ./internal/egress
            ./internal/health ./internal/hostile ./internal/keys
            ./internal/library ./internal/metrics ./internal/observe
            ./internal/policyadmin ./internal/policystore
            ./internal/posixacl ./internal/profile ./internal/reqtest
            ./internal/sandbox/probe ./internal/session ./internal/testport
            ./internal/versions ./internal/winpath ./internal/winsandbox ./internal/winsec ./internal/winsvc ./packaging/linux
            ./tools/provenance ./tools/reqreport ./tools/sbomcheck
            ./tools/uilint
        run: |
          mkdir -p build
          # shellcheck disable=SC2086 # the list is split on purpose
          go test -short -count=1 $WINDOWS_TEST_PACKAGES
          # The Windows-only tests' requirement claims go to the status job
          # (build/windows-test.json, FR-21.19); their names are unique to
          # Windows, so they never replace a Linux result of the same test.
          rc=0
          go test -json -count=1 -run '^TestWindows' ./internal/keys ./internal/pipeline ./internal/edge ./internal/winsec ./internal/winsvc ./internal/durable ./internal/health ./internal/filters > build/windows-test.json || rc=1
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Package | sub(".*/secure-mcp-gateway/"; ""))\t\(.Test)"' build/windows-test.json
          exit "$rc"
      # The Windows backend sandbox (FR-21.11, FR-21.12, SR-4.8-2): Job
      # Objects, launch and the hostile resource fixtures on this runner.
      # Their requirement claims are merged by the status job.
      - name: Windows sandbox tests and their claims
        run: |
          mkdir -p build
          go test -count=1 -json ./internal/winsandbox ./internal/library ./internal/app \
            -run 'Windows|CheckCommand|CPURate|RuntimeLimits' > build/windows-sandbox-test.json || true
          go test -count=1 -json -run 'Windows' ./internal/pipeline ./internal/hostile >> build/windows-sandbox-test.json || true
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Package) \(.Test)"' build/windows-sandbox-test.json
          if jq -e -s 'any(.[]; .Action == "fail")' build/windows-sandbox-test.json >/dev/null; then
            jq -r 'select(.Action == "output") | .Output' build/windows-sandbox-test.json | tail -200
            exit 1
          fi
      # FR-21.5, FR-21.6, FR-21.7, FR-21.10: smcpctl install in the per-user
      # mode, the DACLs and DPAPI keys, the task, a killed smcpd restarted
      # by its supervisor, and uninstall's orderly stop through the stop
      # event (scripts/windows-install-smoke.ps1).
      - name: Per-user install smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\win\bin | Out-Null
          foreach ($c in 'smcpd', 'smcpctl', 'smcp-refserver') { go build -o "build\win\bin\$c.exe" "./cmd/$c"; if ($LASTEXITCODE) { exit 1 } }
          ./scripts/windows-install-smoke.ps1 -BinDir build\win\bin
      - name: Every package, measured (informational, never fails)
        continue-on-error: true
        run: |
          mkdir -p build
          go test -short -count=1 -timeout 20m -json ./... > build/windows-all-test.json || true
          {
            echo "### Windows: every package (informational)"
            echo '```'
            jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Package)"' build/windows-all-test.json | sort
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r -s '
            map(select(.Test != null)) | group_by(.Package + " " + .Test)
            | map(select(any(.[]; .Action == "fail")))
            | .[] | "--- FAIL: \(.[0].Package) \(.[0].Test)", (map(select(.Action == "output") | .Output) | join("") | .[0:3000])
          ' build/windows-all-test.json || true
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-results
          path: |
            build/windows-test.json
            build/windows-sandbox-test.json
            build/windows-all-test.json
          if-no-files-found: warn
          retention-days: 14

  # Desktop Application (E-34, SRS FR-20, planned for v1.3.0) on macOS arm64
  # and Ubuntu 24.04: rustfmt, clippy, the Rust tests with their requirement
  # claims, the bundled windows' typecheck and tests, and on macOS the
  # unsigned .app bundle. Not a required check. Runs when desktop/, Go code
  # or this workflow changes (changes.outputs.desktop) and on every other
  # trigger; on pull requests the macOS leg only when desktop/,
  # tools/reqreport or this workflow changes (changes.outputs.desktop-matrix;
  # docs/ci.md, "macOS runners"); the claims (build/desktop-<platform>-test.json, written by
  # `reqreport cargo`) go to the status job.
  desktop:
    name: desktop (${{ matrix.platform }})
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.desktop-matrix || '[{"os":"macos-15","platform":"macos"},{"os":"ubuntu-24.04","platform":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_VERSION: "1.94.0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: WebKitGTK and tray libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev >/dev/null
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
          rustc --version
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-${{ env.RUST_VERSION }}-
      - name: Install, typecheck, test and build the bundled windows
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Application icons match their generator (docs/design/visual.md)
        if: runner.os == 'Linux'
        run: python3 -I desktop/scripts/make-icons.py --check
      - name: Bundled windows in WebKit and Chromium (axe WCAG 2.2 AA, CSP, keyboard, reduced motion; FR-20.43)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npx --no-install playwright install chromium webkit
          npm run test:a11y
      - name: npm audit (high and critical, with the reviewed allowlist)
        run: scripts/npm-audit-gate.sh desktop
      - name: cargo fmt
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test and requirement claims (FR-12.10)
        working-directory: desktop/src-tauri
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          mkdir -p ../../build
          rm -f "$RUNNER_TEMP/claims.tsv"
          rc=0
          SMCP_CLAIMS_FILE="$RUNNER_TEMP/claims.tsv" cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.txt" || rc=$?
          (cd ../.. && go run ./tools/reqreport cargo -test-output "$RUNNER_TEMP/cargo-test.txt" -claims "$RUNNER_TEMP/claims.tsv" \
            -package "desktop/$PLATFORM" -out "build/desktop-$PLATFORM-test.json") || rc=1
          exit "$rc"
      - name: Upload the requirement claims
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-results-${{ matrix.platform }}
          path: build/desktop-*-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build the application bundle (macOS, unsigned)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          npx --no-install tauri build --bundles app --no-sign
          app="src-tauri/target/release/bundle/macos/Secure MCP Gateway.app"
          test -x "$app/Contents/MacOS/smcp-desktop"
          file "$app/Contents/MacOS/smcp-desktop" | grep -q arm64
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/smcp-desktop-macos-arm64.zip"
      - name: Upload the application bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-app-macos-arm64
          path: ${{ runner.temp }}/smcp-desktop-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Platform installers (E-35, FR-20.24): build the .deb, .rpm and macOS
  # .pkg as snapshots (all on Linux) and install, exercise and remove each
  # one (installers.yml, which the release workflow also runs before
  # publishing). Heavy; not a required check. The .pkg smoke test on macOS
  # runs on pull requests only when the .pkg can change
  # (changes.outputs.macos-pkg) and never blocks on a missing macOS runner
  # (docs/ci.md, "macOS runners").
  installers:
    name: installers
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    uses: ./.github/workflows/installers.yml
    with:
      macos-smoke: ${{ needs.changes.result != 'success' || needs.changes.outputs.macos-pkg != 'false' }}
    permissions:
      contents: read

  # Management console (E-24): typecheck and build console/, check that the
  # committed console/dist (embedded into smcpd) matches the sources, audit
  # its npm dependencies and run the Playwright acceptance tests against a
  # real smcpd on Chromium, Firefox and WebKit (FR-8.30), one fresh Gateway
  # per browser. The requirement claims of the run (build/console-*-test.json,
  # FR-8.34) go to the status job.
  console:
    name: console
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The graph mirror for the G-14 investigation test (console/e2e/
    # decision.spec.ts, FR-8.22) on a dedicated Gateway.
    services:
      neo4j:
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/smcp-ci-graph-password
          NEO4J_server_http_enabled: "false"
          NEO4J_dbms_usage__report_enabled: "false"
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p smcp-ci-graph-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: console
      - name: Typecheck and build
        run: npm run build
        working-directory: console
      - name: Committed console/dist matches the sources
        run: |
          if [ -n "$(git status --porcelain -- console/dist)" ]; then
            git status --porcelain -- console/dist
            echo "::error file=console/dist/index.html::console/dist is stale. Run: make console, then commit console/dist"
            exit 1
          fi
      - name: npm audit (high and critical, with the reviewed allowlist)
        run: scripts/npm-audit-gate.sh console
      - name: Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: console
      - name: Build the Gateway binaries once for the three runs
        run: |
          mkdir -p build/e2e-bin
          go build -o build/e2e-bin/ ./cmd/smcpd ./cmd/smcpctl ./cmd/smcp-refserver ./scripts/itest-client ./scripts/evidence-fixture
      - name: Acceptance tests against a running smcpd (Chromium, Firefox, WebKit)
        env:
          CI: "1"
          SMCP_E2E_BIN: ${{ github.workspace }}/build/e2e-bin
          SMCP_NEO4J_URL: bolt://127.0.0.1:7687
          SMCP_NEO4J_USER: neo4j
          SMCP_NEO4J_PASSWORD: smcp-ci-graph-password
        run: npm run test:e2e
        working-directory: console
      - name: Upload the requirement claims of the acceptance tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-results
          path: build/console-*-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-playwright
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  # AT-07 in the Enforced profile (FR-19.3): the console's inert-evidence
  # tests (console/e2e/inert.spec.ts), and the keyboard kill of a real
  # sandboxed instance (FR-8.33), on Chromium against a Gateway whose
  # reference server runs in rootless Podman (SMCP_E2E_PROFILE=enforced).
  # The claims go to build/console-chromium-enforced-test.json (package
  # console/e2e/chromium/enforced), which the status job merges. Not a
  # required check; every trigger except pull requests.
  console-enforced:
    name: console-enforced
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Rootless Podman with delegated cgroup controllers
        run: |
          command -v podman >/dev/null
          if ! podman info --format '{{.Host.CgroupControllers}}' 2>/dev/null | grep -q memory; then
            sudo -n loginctl enable-linger "$(id -un)" || true
            for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
            XDG_RUNTIME_DIR="/run/user/$(id -u)" podman system migrate >/dev/null 2>&1 || true
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: console
      - name: Playwright browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: console
      - name: Build the Gateway binaries (the reference server statically linked)
        run: |
          mkdir -p build/e2e-bin
          go build -o build/e2e-bin/ ./cmd/smcpd ./cmd/smcpctl ./scripts/itest-client
          CGO_ENABLED=0 go build -trimpath -o build/e2e-bin/ ./cmd/smcp-refserver
      # The Runtime kill with the keyboard on a real sandboxed instance
      # (FR-8.33, console/e2e/keyboard.spec.ts) runs in the same Gateway.
      - name: AT-07 inert evidence display and the keyboard kill of a real instance in the Enforced profile (Chromium)
        env:
          CI: "1"
          SMCP_E2E_BIN: ${{ github.workspace }}/build/e2e-bin
          SMCP_E2E_PROFILE: enforced
          SMCP_E2E_PROJECT: chromium-enforced
        run: npx --no-install playwright test --project=chromium e2e/inert.spec.ts e2e/keyboard.spec.ts --grep "inert|256 KiB|real sandboxed instance"
        working-directory: console
      - name: Upload the requirement claims
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-enforced-results
          path: build/console-chromium-enforced-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-enforced-playwright
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Graph mirror integration tests (E-25, E-26, E-28) against Neo4j
  # Community Edition in a service container. Not a required check.
  # FR-8.30, previous browser builds: the console suite on the browser
  # builds of the Playwright release before the pinned one (1.63.0:
  # Chromium 153, Firefox 155, WebKit 26.6), each against a fresh Gateway as
  # in the console job. It shows that the console works on the browser
  # builds before the current ones; it is not a run on the previous major
  # release of each browser product (Playwright ships one build of each
  # engine per release, and WebKit is not Safari), so it feeds no claim and
  # is not a required check. Every trigger except pull requests.
  console-previous-browsers:
    name: console-previous-browsers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      neo4j:
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/smcp-ci-graph-password
          NEO4J_server_http_enabled: "false"
          NEO4J_dbms_usage__report_enabled: "false"
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p smcp-ci-graph-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      PREVIOUS_PLAYWRIGHT: "1.63.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install, with the previous Playwright release in place of the pinned one
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "@playwright/test@${PREVIOUS_PLAYWRIGHT}" "playwright@${PREVIOUS_PLAYWRIGHT}" "playwright-core@${PREVIOUS_PLAYWRIGHT}"
          test "$(npx --no-install playwright --version)" = "Version ${PREVIOUS_PLAYWRIGHT}"
        working-directory: console
      - name: Playwright browsers of that release
        run: |
          npx --no-install playwright install --with-deps chromium firefox webkit
          jq -r '.browsers[] | select(.name == "chromium" or .name == "firefox" or .name == "webkit") | "\(.name) \(.browserVersion)"' node_modules/playwright-core/browsers.json
        working-directory: console
      - name: Build the Gateway binaries once for the three runs
        run: |
          mkdir -p build/e2e-bin
          go build -o build/e2e-bin/ ./cmd/smcpd ./cmd/smcpctl ./cmd/smcp-refserver ./scripts/itest-client ./scripts/evidence-fixture
      - name: Acceptance tests on the previous browser builds (Chromium, Firefox, WebKit)
        env:
          CI: "1"
          SMCP_E2E_BIN: ${{ github.workspace }}/build/e2e-bin
          SMCP_NEO4J_URL: bolt://127.0.0.1:7687
          SMCP_NEO4J_USER: neo4j
          SMCP_NEO4J_PASSWORD: smcp-ci-graph-password
        run: npm run test:e2e
        working-directory: console
      - name: Upload the per-browser results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-previous-browsers-results
          path: build/console-*-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-previous-browsers-playwright
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  graph:
    name: graph
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      neo4j:
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/smcp-ci-graph-password
          NEO4J_server_http_enabled: "false"
          NEO4J_server_https_enabled: "false"
          NEO4J_dbms_usage__report_enabled: "false"
          NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p smcp-ci-graph-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      # SR-7.4-1 (Inspection): no plugin archives, no plugin procedures
      # (apoc., gds.); the effective settings, unrestricted procedures
      # among them, are checked by TestNeo4jQueriesRetentionAndEngineStatus (SMCP_NEO4J_HARDENED).
      - name: Graph engine plugins and procedures (SR-7.4-1)
        env:
          NEO4J_CONTAINER: ${{ job.services.neo4j.id }}
        run: |
          plugins=$(docker exec "$NEO4J_CONTAINER" sh -c 'find /var/lib/neo4j/plugins -name "*.jar" 2>/dev/null || true')
          echo "plugin archives (*.jar): ${plugins:-(empty)}"
          [ -z "$plugins" ] || { echo "the graph engine has plugins installed"; exit 1; }
          docker exec "$NEO4J_CONTAINER" cypher-shell -u neo4j -p smcp-ci-graph-password --format plain \
            "SHOW PROCEDURES YIELD name RETURN name ORDER BY name" | tee "$RUNNER_TEMP/procs.txt"
          if grep -Eq '^"?(apoc|gds)\.' "$RUNNER_TEMP/procs.txt"; then echo "plugin procedures are installed"; exit 1; fi
          docker exec "$NEO4J_CONTAINER" cypher-shell -u neo4j -p smcp-ci-graph-password --format plain \
            "CALL dbms.listConfig() YIELD name, value WHERE name IN ['server.http.enabled', 'server.https.enabled', 'dbms.usage_report.enabled', 'dbms.security.allow_csv_import_from_file_urls', 'dbms.security.procedures.unrestricted'] RETURN name, value"
      - name: Graph tests against Neo4j
        env:
          SMCP_NEO4J_URL: bolt://127.0.0.1:7687
          SMCP_NEO4J_USER: neo4j
          SMCP_NEO4J_PASSWORD: smcp-ci-graph-password
          SMCP_NEO4J_HARDENED: "1"
        run: |
          mkdir -p build
          rc=0
          go test -race -count=1 -p 1 -json ./internal/graph/... ./internal/e2e/ -run 'Neo4j|Graph' > build/graph-test.json || rc=$?
          go test -count=1 -json ./cmd/smcpctl/ -run 'Graph' >> build/graph-test.json || rc=$?
          # AT-11 and AT-12 against the real binaries and Neo4j (Standalone).
          go test -count=1 -json -timeout 15m ./internal/acceptance/ -run 'TestAT1[12]' >> build/graph-test.json || rc=$?
          jq -r 'select(.Action == "fail" and .Test != null) | "FAIL \(.Package) \(.Test)"' build/graph-test.json || true
          exit "$rc"
      # The status job merges these results, so the requirement claims of
      # tests that need Neo4j (skipped in the go job) reach the report.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-results
          path: build/graph-test.json
          if-no-files-found: warn
          retention-days: 14

  # Hostile backend fixture suite (SRS Appendix L, FR-19.1, FR-19.2): the
  # real Gateway against each misbehaving fixture, in the Standalone profile
  # and, where rootless Podman works on the runner, in the Enforced profile.
  # A row whose defense is missing is reported with pass=false in
  # build/hostile.json; the job still succeeds. Not a required check.
  hostile:
    name: hostile
    needs: [changes, srs, lint]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.srs.result == 'success' && needs.lint.result == 'success')) && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Vet the suite
        run: go vet -tags hostile ./internal/hostile/
      - name: Standalone profile
        run: |
          mkdir -p build
          if ! go test -tags hostile -count=1 -json -run 'TestHostileFixtures|TestHostileContextForge' ./internal/hostile/ > build/hostile-standalone-test.json; then
            echo "::warning::hostile suite (standalone): a harness check failed; see build/hostile-standalone-test.json"
          fi
      - name: Streamable HTTP transport (FR-5.28; every applicable row must pass)
        run: go test -tags hostile -count=1 -run TestHostileHTTPFixtures ./internal/hostile/
      - name: Enforced profile (rootless Podman sandbox)
        env:
          # Every Enforced row (HF-20, HF-21, HF-23, HF-24) must pass here.
          SMCP_HOSTILE_REQUIRE_ENFORCED: "1"
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "podman not installed; enforced rows stay not asserted"
            exit 0
          fi
          # Servers with network = "egress" (HF-24) run on slirp4netns.
          command -v slirp4netns >/dev/null 2>&1 || sudo apt-get install -y -qq slirp4netns >/dev/null
          # Rootless Podman delegates cgroup controllers through the user's
          # systemd instance; a runner may have no user session (as in
          # scripts/ci-integration.sh).
          if ! podman info --format '{{.Host.CgroupControllers}}' 2>/dev/null | grep -q memory; then
            sudo -n loginctl enable-linger "$(id -un)" || true
            for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            podman system migrate >/dev/null 2>&1 || true
          fi
          # The results are renamed to the package .../internal/hostile/enforced:
          # the Standalone run has tests of the same names (AT-08 skips
          # there), and tools/reqreport keeps the last result of a test name.
          rc=0
          CGO_ENABLED=0 SMCP_HOSTILE_PROFILE=enforced go test -tags hostile -count=1 -json -run TestHostileFixtures ./internal/hostile/ > build/hostile-enforced-raw.json || rc=$?
          jq -c 'if .Package then .Package += "/enforced" else . end' build/hostile-enforced-raw.json > build/hostile-enforced-test.json
          if [ "$rc" != 0 ]; then
            echo "::error::hostile suite (enforced): an Enforced row failed or a harness check failed; see build/hostile-enforced-test.json"
            jq -r 'select(.Action == "output" and (.Output | test("Enforced row|FAIL|harness|gateway start"))) | .Output' build/hostile-enforced-test.json || true
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          if [ -f build/hostile.md ]; then cat build/hostile.md >> "$GITHUB_STEP_SUMMARY"; else echo "no hostile results" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f build/hostile-contextforge.md ]; then cat build/hostile-contextforge.md >> "$GITHUB_STEP_SUMMARY"; fi
          jq -r -s 'map(select(.Action == "output" and (.Output | test("pass=|skip|enforced profile unavailable")))) | .[].Output' build/hostile-*-test.json 2>/dev/null || true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-results
          path: |
            build/hostile.json
            build/hostile.md
            build/hostile-standalone.json
            build/hostile-enforced.json
            build/hostile-standalone-test.json
            build/hostile-enforced-test.json
            build/hostile-contextforge.json
            build/hostile-contextforge.md
          if-no-files-found: warn
          retention-days: 14

  # The bundled ContextForge instance against the pinned image (E-36,
  # docs/contextforge.md; planned v1.3.0): image verification with cosign,
  # the generated configuration and credentials, routes the configuration
  # turns off, health, and the instance started through the Connector with
  # its credentials in a vault. Pulls about 600 MB. Not a required check.
  contextforge:
    name: contextforge
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Pinned image tests
        env:
          SMCP_CONTEXTFORGE_IMAGE: "1"
        run: |
          mkdir -p build
          rc=0
          go test -count=1 -json -run 'Image|Network' ./internal/contextforge/... > build/contextforge-test.json || rc=$?
          jq -r 'select(.Action == "output") | .Output' build/contextforge-test.json | grep -E '^(--- |ok |FAIL|PASS|    .*(healthy after|SKIP|skip))' || true
          exit "$rc"
      - name: Remove the instance's containers and volumes
        if: always()
        run: |
          docker ps -aq --filter label=smcp.component=contextforge | xargs -r docker rm -f
          docker volume ls -q | grep '^smcp-c' | xargs -r docker volume rm -f || true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contextforge-results
          path: build/contextforge-test.json
          if-no-files-found: warn
          retention-days: 14

  # FR-11 measurements with the reference workload (cmd/smcp-workload,
  # docs/acceptance.md) against real smcpd instances on the runner, the
  # recorded reference hardware class (docs/reference-hardware.md; perf.json
  # records the run's processor, memory and disk). The status job publishes
  # build/perf.json as "performance" and merges build/perf-test.json (a
  # complete measurement within its CP-32 budget on the reference hardware
  # is a full claim, an incomplete one a partial claim, one over budget a
  # failing test). Not a required check; pushes to main and
  # workflow_dispatch only.
  perf:
    name: perf
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Build smcpd, smcpctl, smcp-refserver and smcp-workload
        run: |
          mkdir -p build/perf-bin
          go build -trimpath -o build/perf-bin/ ./cmd/smcpd ./cmd/smcpctl ./cmd/smcp-workload
          CGO_ENABLED=0 go build -trimpath -o build/perf-bin/ ./cmd/smcp-refserver
      - name: Measure FR-11.2, FR-11.4, FR-11.5, FR-11.6, FR-11.8 and FR-11.9
        run: |
          # The graph mirror's engine for FR-11.9, with the CP-33 memory
          # budget that smcpctl graph config prints (1 GiB heap, 1 GiB page
          # cache). smcp-workload starts it only for the FR-11.9 measurement,
          # after the FR-11.4 loads.
          docker create --name smcp-perf-neo4j -p 127.0.0.1:7687:7687 \
            -e NEO4J_AUTH=neo4j/smcp-ci-graph-password -e NEO4J_server_http_enabled=false \
            -e NEO4J_dbms_usage__report_enabled=false -e NEO4J_server_memory_heap_initial__size=1g \
            -e NEO4J_server_memory_heap_max__size=1g -e NEO4J_server_memory_pagecache_size=1g \
            neo4j:2026.05.0-community
          printf '%s' smcp-ci-graph-password > "$RUNNER_TEMP/graph-password"
          build/perf-bin/smcp-workload run --bin build/perf-bin --out build/perf.json --test-json build/perf-test.json \
            --calls 2000 --decisions 100000 --queries 100 --idle 10m --ingest 10m --rate 2000 \
            --graph-uri bolt://127.0.0.1:7687 --graph-password-file "$RUNNER_TEMP/graph-password" --graph-container smcp-perf-neo4j
          {
            echo "## Performance"
            echo
            jq -r '"Host: \(.host.cpu), \(.host.cpus) processors, \((.host.memoryBytes // 0) / 1073741824 * 10 | round / 10) GiB memory, disk \(.host.diskDevice // "?") \(.host.diskModel // "") \((.host.diskBytes // 0) / 1073741824 | round) GiB (\((.host.diskFreeBytes // 0) / 1073741824 | round) GiB free), image \(.host.image // "?") \(.host.imageVersion // ""). Reference hardware: \(.referenceHardware) \(.referenceClass // "")"' build/perf.json
            echo
            echo "| Requirement | Measurement | Value | Budget | Pass | Complete |"
            echo "|---|---|---|---|---|---|"
            jq -r '.measurements[] | "| \(.requirement) | \(.name) (\(.metric)) | \(.value * 1000 | round / 1000) \(.unit) | \(.budget) \(.unit) | \(.pass) | \(.complete) |"' build/perf.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: |
            build/perf.json
            build/perf-test.json
          if-no-files-found: warn
          retention-days: 14

  # The acceptance scenarios of internal/acceptance in the Enforced profile
  # (rootless Podman), so that the release label (FR-19.3) can count them.
  # AT-11 and AT-12 use the graph mirror on Neo4j Community Edition in a
  # service container. Results are renamed to the package
  # .../internal/acceptance/enforced and merged by the status job. Not a
  # required check; every trigger except pull requests.
  acceptance-enforced:
    name: acceptance-enforced
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      neo4j:
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/smcp-ci-graph-password
          NEO4J_server_http_enabled: "false"
          NEO4J_dbms_usage__report_enabled: "false"
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p smcp-ci-graph-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Rootless Podman with delegated cgroup controllers
        run: |
          command -v podman >/dev/null
          command -v slirp4netns >/dev/null 2>&1 || sudo apt-get install -y -qq slirp4netns >/dev/null
          if ! podman info --format '{{.Host.CgroupControllers}}' 2>/dev/null | grep -q memory; then
            sudo -n loginctl enable-linger "$(id -un)" || true
            for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
            XDG_RUNTIME_DIR="/run/user/$(id -u)" podman system migrate >/dev/null 2>&1 || true
          fi
      - name: Acceptance scenarios in the Enforced profile
        env:
          SMCP_ACCEPTANCE_PROFILE: enforced
          SMCP_ADMIN_CLI_EVIDENCE: ${{ github.workspace }}/build/admin-cli
          SMCP_NEO4J_URL: bolt://127.0.0.1:7687
          SMCP_NEO4J_USER: neo4j
          SMCP_NEO4J_PASSWORD: smcp-ci-graph-password
        run: |
          # The sandbox refuses mounts at or below /tmp: instance
          # directories go under the runner's temporary directory.
          mkdir -p "$RUNNER_TEMP/acceptance"
          export TMPDIR="$RUNNER_TEMP/acceptance"
          mkdir -p build
          rc=0
          go test -count=1 -json -timeout 35m -run 'TestAT|TestEnforcedSecretDelivery|TestAdminCLIDemonstration' ./internal/acceptance/ > build/acceptance-raw.json || rc=$?
          jq -c 'if .Package then .Package += "/enforced" else . end' build/acceptance-raw.json > build/acceptance-enforced-test.json
          jq -r 'select(.Action == "fail" and .Test != null) | "FAIL \(.Test)"' build/acceptance-enforced-test.json || true
          if [ "$rc" != 0 ]; then echo "::warning::acceptance scenarios failed in the Enforced profile; see build/acceptance-enforced-test.json"; fi
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-enforced-results
          path: |
            build/acceptance-enforced-test.json
            build/admin-cli/*.json
          if-no-files-found: warn
          retention-days: 14

  # FR-12.2 and AT-17: the reference filesystem and git packages are built
  # with network access, then the acceptance suite runs in a network
  # namespace with loopback only (scripts/ci-offline.sh), and AT-17 runs
  # again there in the Enforced profile: every server in rootless Podman,
  # the node and python packages on node and python images pulled (and
  # pinned by digest) beforehand. Not a required check; every trigger
  # except pull requests.
  offline:
    name: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the reference filesystem and git packages (needs the registries)
        env:
          SMCP_PYTHON: /usr/bin/python3
          SMCP_REFPKG_ONLY: filesystem git
        run: scripts/build-reference-packages.sh "$RUNNER_TEMP/refpkg"
      - name: Acceptance suite with outbound Internet blocked
        env:
          SMCP_REFPKG_DIR: ${{ runner.temp }}/refpkg
          SMCP_PYTHON: /usr/bin/python3
        run: |
          if ! scripts/ci-offline.sh build/offline-test.json; then
            echo "::warning::acceptance tests failed offline; see build/offline-test.json"
          fi
          jq -r 'select(.Action == "fail" and .Test != null) | "FAIL \(.Test)"' build/offline-test.json || true
      - name: Rootless Podman and the node and python images (pinned by digest)
        run: |
          command -v podman >/dev/null
          if ! podman info --format '{{.Host.CgroupControllers}}' 2>/dev/null | grep -q memory; then
            sudo -n loginctl enable-linger "$(id -un)" || true
            for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
            XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export XDG_RUNTIME_DIR
            podman system migrate >/dev/null 2>&1 || true
          fi
          # The PyPI package was built with /usr/bin/python3 (3.12): its
          # compiled wheels need Python 3.12. The full Debian image carries
          # the git binary, which the git server runs.
          for v in "SMCP_AT17_NODE_IMAGE docker.io/library/node:24-bookworm-slim" "SMCP_AT17_PYTHON_IMAGE docker.io/library/python:3.12-bookworm"; do
            name=${v%% *} ref=${v#* }
            podman pull -q "$ref" >/dev/null
            digest=$(podman image inspect --format '{{.Digest}}' "$ref")
            echo "$name=${ref%%:*}@$digest" >> "$GITHUB_ENV"
            echo "$name=${ref%%:*}@$digest"
          done
      - name: AT-17 offline in the Enforced profile
        env:
          SMCP_REFPKG_DIR: ${{ runner.temp }}/refpkg
          SMCP_PYTHON: /usr/bin/python3
          SMCP_ACCEPTANCE_PROFILE: enforced
          SMCP_OFFLINE_RUN: ^TestAT17
        run: |
          # The sandbox refuses mounts at or below /tmp.
          mkdir -p "$RUNNER_TEMP/offline-enforced"
          export TMPDIR="$RUNNER_TEMP/offline-enforced"
          if ! scripts/ci-offline.sh build/offline-enforced-test.json; then
            echo "::warning::AT-17 failed offline in the Enforced profile; see build/offline-enforced-test.json"
          fi
          jq -r 'select(.Action == "output" and .Test != null) | .Output' build/offline-enforced-test.json | tail -n 60 || true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-results
          path: |
            build/offline-test.json
            build/offline-enforced-test.json
          if-no-files-found: warn
          retention-days: 14

  # Builds the status document of the run (status.json with every job's
  # results merged) and uploads it as the artifact status-document, with
  # the FR-19.3 release label in the job summary. For pushes to main it
  # also publishes status.json and history.json to the orphan branch
  # site-data and asks Vercel to rebuild the site; for release tags and
  # dispatched runs it publishes nothing (the release workflow reads the
  # artifact of the tag's run). The site-data branch never starts a
  # workflow: CI and the other workflows run on pull requests, pushes to
  # main and tags only, and GITHUB_TOKEN pushes do not trigger workflows in
  # any case.
  status:
    name: status
    if: >-
      always() && github.event_name != 'pull_request' &&
      (needs.go.result == 'success' || needs.go.result == 'failure')
    needs: [srs, go, lint, site, security, linux-integration, install-standalone, install-guide, hostile, console, console-enforced, graph, perf, acceptance-enforced, offline, desktop, windows, contextforge]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-site-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: hostile-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: console-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: graph-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: contextforge-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: perf-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: acceptance-enforced-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: offline-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: linux-integration-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: console-enforced-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: install-standalone-results-*
          merge-multiple: true
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: windows-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: desktop-results-*
          merge-multiple: true
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: install-guide-results-*
          merge-multiple: true
          path: build
      - name: Fetch the results of the separate verification workflows (site-data/workflows.json; FR-13.3 tap, FR-14.9 reference packages)
        run: |
          if git fetch --quiet --depth=1 origin refs/heads/site-data 2>/dev/null &&
             git show FETCH_HEAD:workflows.json > build/workflows.json 2>/dev/null &&
             jq -e 'type == "array"' build/workflows.json >/dev/null; then
            echo "fetched $(jq length build/workflows.json) workflow results"
          else
            rm -f build/workflows.json
            echo "no published workflow results yet"
          fi
      - name: Merge the hostile fixture, console acceptance and graph results and their requirement claims (FR-19.2, FR-8.34)
        run: |
          cp build/go-test.json build/all-test.json
          merged=0
          if [ -s build/workflows.json ]; then merged=1; fi
          if [ -s build/hostile.json ] && jq -e 'type == "array"' build/hostile.json >/dev/null; then
            cat build/hostile-*-test.json >> build/all-test.json 2>/dev/null || true
            merged=1
          else
            rm -f build/hostile.json
            echo "no hostile results"
          fi
          if ls build/console-*-test.json >/dev/null 2>&1; then
            cat build/console-*-test.json >> build/all-test.json
            merged=1
          else
            echo "no console results"
          fi
          # Neo4j-backed tests skip in the go job; their run in the graph job
          # comes later in the file, so its result is the one counted.
          if [ -s build/graph-test.json ]; then
            cat build/graph-test.json >> build/all-test.json
            merged=1
          else
            echo "no graph results"
          fi
          # The pinned ContextForge image tests skip in the go job; their
          # run in the contextforge job comes later, so it is counted.
          if [ -s build/contextforge-test.json ]; then
            cat build/contextforge-test.json >> build/all-test.json
            merged=1
          else
            echo "no contextforge results"
          fi
          # The perf measurements, the Enforced-profile acceptance run, the
          # offline acceptance run (FR-11, FR-19.3, FR-12.2) and the Go tests
          # of linux-integration that need real Podman or a network
          # namespace (skipped in the go job; their result here is counted).
          # smcpctl install with the real service managers (FR-13.6 needs
          # both macOS and Linux): merged only when both runners reported.
          if [ -s build/install-standalone-macos-test.json ] && [ -s build/install-standalone-linux-test.json ]; then
            cat build/install-standalone-macos-test.json build/install-standalone-linux-test.json >> build/all-test.json
            merged=1
          else
            echo "install-standalone results missing for one runner; not merged"
          fi
          # The desktop application's Rust test claims (FR-20, desktop job),
          # one file per platform.
          for f in build/desktop-macos-test.json build/desktop-linux-test.json; do
            if [ -s "$f" ]; then
              cat "$f" >> build/all-test.json
              merged=1
            else
              echo "no $f"
            fi
          done
          # The Windows-only tests of the windows job (FR-21).
          if [ -s build/windows-test.json ]; then
            cat build/windows-test.json >> build/all-test.json
            merged=1
          else
            echo "no windows results"
          fi
          # The Windows backend sandbox tests on windows-latest (FR-21).
          if [ -s build/windows-sandbox-test.json ]; then
            cat build/windows-sandbox-test.json >> build/all-test.json
            merged=1
          else
            echo "no windows sandbox results"
          fi
          # The install guide followed on both runners (FR-18.1).
          if [ -s build/install-guide-macos-test.json ] && [ -s build/install-guide-linux-test.json ]; then
            cat build/install-guide-macos-test.json build/install-guide-linux-test.json >> build/all-test.json
            merged=1
          else
            echo "install-guide results missing for one runner; not merged"
          fi
          for f in perf-test acceptance-enforced-test offline-test offline-enforced-test linux-integration-test; do
            if [ -s "build/$f.json" ]; then
              cat "build/$f.json" >> build/all-test.json
              merged=1
            else
              echo "no $f results"
            fi
          done
          # FR-13.4 and FR-13.11 in both profiles: the Standalone runs on
          # macOS and Ubuntu and the Enforced run of linux-integration,
          # read together by tools/reqreport.TestInstallProfilesEvidence.
          if [ -s build/install-standalone-macos-test.json ] && [ -s build/install-standalone-linux-test.json ] && [ -s build/linux-integration-test.json ]; then
            SMCP_INSTALL_EVIDENCE_MACOS="$PWD/build/install-standalone-macos-test.json" \
            SMCP_INSTALL_EVIDENCE_LINUX="$PWD/build/install-standalone-linux-test.json" \
            SMCP_INSTALL_EVIDENCE_ENFORCED="$PWD/build/linux-integration-test.json" \
              go test -json -count=1 -run '^TestInstallProfilesEvidence$' ./tools/reqreport/ > build/install-profiles-test.json || true
            cat build/install-profiles-test.json >> build/all-test.json
          else
            echo "install results missing for a profile; FR-13.4 and FR-13.11 not combined"
          fi
          if [ "$merged" = 1 ]; then
            go run ./tools/reqreport -in build/all-test.json -coverprofile build/cover.out -fail-on-failing=false
          fi
      - name: Merge the latest real-agent results (agents workflow, site-data/agents.json)
        run: |
          if git fetch --quiet --depth=1 origin refs/heads/site-data 2>/dev/null &&
             git show FETCH_HEAD:agents.json > build/agents.json 2>/dev/null &&
             jq -e 'type == "array"' build/agents.json >/dev/null; then
            jq --slurpfile a build/agents.json '.agents = $a[0]' build/status.json > build/status.tmp
            mv build/status.tmp build/status.json
            echo "merged $(jq length build/agents.json) agent results"
          else
            echo "no published agent results yet"
          fi
      - name: Add the performance measurements (perf job, build/perf.json)
        run: |
          if [ -s build/perf.json ] && jq -e '.measurements | type == "array"' build/perf.json >/dev/null; then
            jq --slurpfile p build/perf.json '.performance = $p[0]' build/status.json > build/status.tmp
            mv build/status.tmp build/status.json
            echo "merged $(jq '.measurements | length' build/perf.json) performance measurements"
          else
            echo "no performance measurements"
          fi
      - name: Record the overall CI conclusion
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          conclusion=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<<"$NEEDS")
          jq --arg c "$conclusion" --arg w "$GITHUB_WORKFLOW" '.ci = {workflow: $w, conclusion: $c}' build/status.json > build/status.tmp
          mv build/status.tmp build/status.json
          echo "CI conclusion: $conclusion"
      - name: Release label of this commit (FR-19.3)
        run: |
          go run ./tools/reqreport label -status build/status.json -commit "$GITHUB_SHA" -out build/release-label.md
          cat build/release-label.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the status document
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-document
          path: |
            build/status.json
            build/release-label.md
          retention-days: 90
      - name: Publish to the site-data branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/publish-status.sh build/status.json
      - name: Trigger a Vercel redeploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: scripts/trigger-site-deploy.sh
