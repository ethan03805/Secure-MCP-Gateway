# Continuous integration. The job names srs, go, lint, site, security and
# linux-integration are required status checks on main; renaming one breaks
# branch protection, so keep them stable.
#
# Triggers: pull requests, pushes to main, and workflow_dispatch. The
# dispatch trigger exists because commits pushed with GITHUB_TOKEN (by the
# regenerate and auto-update workflows) do not start workflows; those
# workflows dispatch CI on the PR branch so the required checks run on the
# new head commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  srs:
    name: srs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate the SRS from srs_build and compare with the committed file
        run: |
          python3 -I srs_build/gen.py . "$RUNNER_TEMP/srs.md"
          if ! diff -u Secure_MCP_Gateway_SRS.md "$RUNNER_TEMP/srs.md"; then
            echo "::error file=Secure_MCP_Gateway_SRS.md::The committed SRS differs from srs_build. Run: python3 -I srs_build/gen.py . Secure_MCP_Gateway_SRS.md"
            exit 1
          fi

  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            spikes/*/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            git ls-files -z '*.go' | xargs -0 gofmt -d
            exit 1
          fi
      - name: go mod tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error file=go.mod::go.mod or go.sum is not tidy. Run: go mod tidy"
            exit 1
          fi
      - name: Test (race, coverage) and map results to requirement IDs (FR-12.10)
        id: test
        run: |
          mkdir -p build
          rc=0
          go test -race -json -coverpkg=./... -coverprofile=build/cover.out ./... > build/go-test.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          go run ./tools/reqreport -in build/go-test.json -coverprofile build/cover.out
          cat build/reqreport.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Output of failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: |
          jq -r -s '
            map(select(.Test != null)) | group_by(.Package + " " + .Test)
            | map(select(any(.[]; .Action == "fail")))
            | .[] | "--- FAIL: \(.[0].Package) \(.[0].Test)", (map(select(.Action == "output") | .Output) | join(""))
          ' build/go-test.json
          jq -r 'select(.Test == null and .Action == "output") | .Output' build/go-test.json | grep -v '^ok \|^?\|^PASS$' || true
      - name: Upload test results and status document
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-results
          path: |
            build/reqreport.json
            build/reqreport.md
            build/status.json
            build/go-test.json
            build/cover.out
          if-no-files-found: warn
          retention-days: 14
      - name: Spike modules still build
        run: |
          for d in spikes/*/; do
            (cd "$d" && go vet ./... && go test ./...)
          done

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-${{ hashFiles('site/src/**', '*.md') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}-
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: site
      - name: Typecheck
        run: npx --no-install tsc --noEmit
        working-directory: site
      - name: Unit tests
        run: npm test
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - name: Check pages and internal links
        run: npm run check-out
        working-directory: site

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high and critical, with the reviewed allowlist)
        run: scripts/npm-audit-gate.sh site
      - name: Secret scan of the new commits (trufflehog)
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

  linux-integration:
    name: linux-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Bootstrap, run smcpd, drive an MCP client, verify the journal
        env:
          SMCP_ITEST_DIR: ${{ runner.temp }}/itest
          SMCP_REQUIRE_PREREQS: "1"
        run: scripts/ci-integration.sh
      - name: Egress broker in a network namespace (direct egress blocked, brokered egress allowed)
        env:
          SMCP_ITEST_DIR: ${{ runner.temp }}/egress
        run: scripts/ci-egress-netns.sh
      - name: Upload the smcpd log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-integration-log
          path: ${{ runner.temp }}/itest/smcpd.log
          if-no-files-found: ignore
          retention-days: 7

  # Management console (E-24): typecheck and build console/, check that the
  # committed console/dist (embedded into smcpd) matches the sources, audit
  # its npm dependencies and run the Playwright acceptance tests against a
  # real smcpd on Chromium, Firefox and WebKit (FR-8.30), one fresh Gateway
  # per browser. The requirement claims of the run (build/console-*-test.json,
  # FR-8.34) go to the status job.
  console:
    name: console
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: console
      - name: Typecheck and build
        run: npm run build
        working-directory: console
      - name: Committed console/dist matches the sources
        run: |
          if [ -n "$(git status --porcelain -- console/dist)" ]; then
            git status --porcelain -- console/dist
            echo "::error file=console/dist/index.html::console/dist is stale. Run: make console, then commit console/dist"
            exit 1
          fi
      - name: npm audit (high and critical, with the reviewed allowlist)
        run: scripts/npm-audit-gate.sh console
      - name: Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit
        working-directory: console
      - name: Build the Gateway binaries once for the three runs
        run: |
          mkdir -p build/e2e-bin
          go build -o build/e2e-bin/ ./cmd/smcpd ./cmd/smcpctl ./cmd/smcp-refserver ./scripts/itest-client
      - name: Acceptance tests against a running smcpd (Chromium, Firefox, WebKit)
        env:
          CI: "1"
          SMCP_E2E_BIN: ${{ github.workspace }}/build/e2e-bin
        run: npm run test:e2e
        working-directory: console
      - name: Upload the requirement claims of the acceptance tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-results
          path: build/console-*-test.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-playwright
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Graph mirror integration tests (E-25, E-26, E-28) against Neo4j
  # Community Edition in a service container. Not a required check.
  graph:
    name: graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:2026.05.0-community
        env:
          NEO4J_AUTH: neo4j/smcp-ci-graph-password
          NEO4J_server_http_enabled: "false"
          NEO4J_dbms_usage__report_enabled: "false"
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 128m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p smcp-ci-graph-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Graph tests against Neo4j
        env:
          SMCP_NEO4J_URL: bolt://127.0.0.1:7687
          SMCP_NEO4J_USER: neo4j
          SMCP_NEO4J_PASSWORD: smcp-ci-graph-password
        run: |
          mkdir -p build
          rc=0
          go test -race -count=1 -p 1 -json ./internal/graph/... ./internal/e2e/ -run 'Neo4j|Graph' > build/graph-test.json || rc=$?
          go test -count=1 -json ./cmd/smcpctl/ -run 'Graph' >> build/graph-test.json || rc=$?
          jq -r 'select(.Action == "fail" and .Test != null) | "FAIL \(.Package) \(.Test)"' build/graph-test.json || true
          exit "$rc"
      # The status job merges these results, so the requirement claims of
      # tests that need Neo4j (skipped in the go job) reach the report.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-results
          path: build/graph-test.json
          if-no-files-found: warn
          retention-days: 14

  # Hostile backend fixture suite (SRS Appendix L, FR-19.1, FR-19.2): the
  # real Gateway against each misbehaving fixture, in the Standalone profile
  # and, where rootless Podman works on the runner, in the Enforced profile.
  # A row whose defense is missing is reported with pass=false in
  # build/hostile.json; the job still succeeds. Not a required check.
  hostile:
    name: hostile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Vet the suite
        run: go vet -tags hostile ./internal/hostile/
      - name: Standalone profile
        run: |
          mkdir -p build
          if ! go test -tags hostile -count=1 -json -run TestHostileFixtures ./internal/hostile/ > build/hostile-standalone-test.json; then
            echo "::warning::hostile suite (standalone): a harness check failed; see build/hostile-standalone-test.json"
          fi
      - name: Enforced profile (rootless Podman sandbox)
        env:
          # Every Enforced row (HF-20, HF-21, HF-23, HF-24) must pass here.
          SMCP_HOSTILE_REQUIRE_ENFORCED: "1"
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            echo "podman not installed; enforced rows stay not asserted"
            exit 0
          fi
          # Servers with network = "egress" (HF-24) run on slirp4netns.
          command -v slirp4netns >/dev/null 2>&1 || sudo apt-get install -y -qq slirp4netns >/dev/null
          # Rootless Podman delegates cgroup controllers through the user's
          # systemd instance; a runner may have no user session (as in
          # scripts/ci-integration.sh).
          if ! podman info --format '{{.Host.CgroupControllers}}' 2>/dev/null | grep -q memory; then
            sudo -n loginctl enable-linger "$(id -un)" || true
            for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            podman system migrate >/dev/null 2>&1 || true
          fi
          if ! CGO_ENABLED=0 SMCP_HOSTILE_PROFILE=enforced go test -tags hostile -count=1 -json -run TestHostileFixtures ./internal/hostile/ > build/hostile-enforced-test.json; then
            echo "::error::hostile suite (enforced): an Enforced row failed or a harness check failed; see build/hostile-enforced-test.json"
            jq -r 'select(.Action == "output" and (.Output | test("Enforced row|FAIL|harness|gateway start"))) | .Output' build/hostile-enforced-test.json || true
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          if [ -f build/hostile.md ]; then cat build/hostile.md >> "$GITHUB_STEP_SUMMARY"; else echo "no hostile results" >> "$GITHUB_STEP_SUMMARY"; fi
          jq -r -s 'map(select(.Action == "output" and (.Output | test("pass=|skip|enforced profile unavailable")))) | .[].Output' build/hostile-*-test.json 2>/dev/null || true
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hostile-results
          path: |
            build/hostile.json
            build/hostile.md
            build/hostile-standalone.json
            build/hostile-enforced.json
            build/hostile-standalone-test.json
            build/hostile-enforced-test.json
          if-no-files-found: warn
          retention-days: 14

  # Publishes status.json and history.json to the orphan branch site-data and
  # asks Vercel to rebuild the site. Runs only for pushes to main. The
  # site-data branch never starts a workflow: CI and the other workflows run
  # on pull requests and on pushes to main only, and GITHUB_TOKEN pushes do
  # not trigger workflows in any case.
  status:
    name: status
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.go.result == 'success' || needs.go.result == 'failure')
    needs: [srs, go, lint, site, security, linux-integration, hostile, console, graph]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-site-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: hostile-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: console-results
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: graph-results
          path: build
      - name: Merge the hostile fixture, console acceptance and graph results and their requirement claims (FR-19.2, FR-8.34)
        run: |
          cp build/go-test.json build/all-test.json
          merged=0
          if [ -s build/hostile.json ] && jq -e 'type == "array"' build/hostile.json >/dev/null; then
            cat build/hostile-*-test.json >> build/all-test.json 2>/dev/null || true
            merged=1
          else
            rm -f build/hostile.json
            echo "no hostile results"
          fi
          if ls build/console-*-test.json >/dev/null 2>&1; then
            cat build/console-*-test.json >> build/all-test.json
            merged=1
          else
            echo "no console results"
          fi
          # Neo4j-backed tests skip in the go job; their run in the graph job
          # comes later in the file, so its result is the one counted.
          if [ -s build/graph-test.json ]; then
            cat build/graph-test.json >> build/all-test.json
            merged=1
          else
            echo "no graph results"
          fi
          if [ "$merged" = 1 ]; then
            go run ./tools/reqreport -in build/all-test.json -coverprofile build/cover.out -fail-on-failing=false
          fi
      - name: Merge the latest real-agent results (agents workflow, site-data/agents.json)
        run: |
          if git fetch --quiet --depth=1 origin refs/heads/site-data 2>/dev/null &&
             git show FETCH_HEAD:agents.json > build/agents.json 2>/dev/null &&
             jq -e 'type == "array"' build/agents.json >/dev/null; then
            jq --slurpfile a build/agents.json '.agents = $a[0]' build/status.json > build/status.tmp
            mv build/status.tmp build/status.json
            echo "merged $(jq length build/agents.json) agent results"
          else
            echo "no published agent results yet"
          fi
      - name: Record the overall CI conclusion
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          conclusion=$(jq -r 'if all(.[]; .result == "success") then "success" else "failure" end' <<<"$NEEDS")
          jq --arg c "$conclusion" --arg w "$GITHUB_WORKFLOW" '.ci = {workflow: $w, conclusion: $c}' build/status.json > build/status.tmp
          mv build/status.tmp build/status.json
          echo "CI conclusion: $conclusion"
      - name: Publish to the site-data branch
        run: scripts/publish-status.sh build/status.json
      - name: Trigger a Vercel redeploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: scripts/trigger-site-deploy.sh
