# Temporary iteration workflow for the verify/windows branch; removed
# before the pull request is marked ready.
name: scratch-verify-windows

on:
  push:
    branches: [verify/windows]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: New Windows tests
        run: |
          mkdir -p build
          go test -json -count=1 -timeout 20m -run '^TestWindows(VaultMasterKey|PipeAccounts|BuildPortability|POSIXReadsReviewed)' ./internal/secrets ./internal/edge ./tools/winport > build/windows-test.json || rc=1
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Package) \(.Test)"' build/windows-test.json
          jq -r 'select(.Action == "output") | .Output' build/windows-test.json | grep -v '^=== ' | tail -150
          exit "${rc:-0}"
      - name: Machine smoke
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\win\bin | Out-Null
          foreach ($c in 'smcpd', 'smcpctl', 'smcp-refserver') { go build -o "build\win\bin\$c.exe" "./cmd/$c"; if ($LASTEXITCODE) { exit 1 } }
          ./scripts/windows-machine-smoke.ps1 -BinDir build\win\bin
      - name: Export
        if: always()
        run: |
          SMCP_DPAPI_EXPORT=$(cygpath -w "$RUNNER_TEMP/dpapi-state")
          export SMCP_DPAPI_EXPORT
          rc=0
          go test -json -count=1 -timeout 15m -run '^TestWindowsStateCopyExport$' ./internal/acceptance/ > build/windows-export-raw.json || rc=$?
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Test)"' build/windows-export-raw.json
          jq -r 'select(.Action == "output") | .Output' build/windows-export-raw.json | grep -v '^=== ' | tail -80
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dpapi-state
          path: ${{ runner.temp }}/dpapi-state
          if-no-files-found: error
          retention-days: 1
  copy:
    needs: [win]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dpapi-state
          path: ${{ runner.temp }}/dpapi-state
      - run: |
          mkdir -p build
          SMCP_DPAPI_IMPORT=$(cygpath -w "$RUNNER_TEMP/dpapi-state")
          export SMCP_DPAPI_IMPORT
          rc=0
          go test -json -count=1 -timeout 15m -run '^TestWindowsStateCopyRefused$' ./internal/acceptance/ > build/windows-copy-test.json || rc=$?
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Test)"' build/windows-copy-test.json
          jq -r 'select(.Action == "output") | .Output' build/windows-copy-test.json | grep -v '^=== ' | tail -60
          exit "$rc"
