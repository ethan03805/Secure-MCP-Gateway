# Builds and publishes a release when a tag v* is pushed: archives for
# linux and darwin (tar.gz) and windows (zip), amd64 and arm64, a SHA-256
# checksum file, its minisign
# signature (release key; secrets MINISIGN_SECRET_KEY and
# MINISIGN_PASSWORD), SBOMs (syft), a Sigstore bundle for the checksum file
# (cosign keyless signing) and the Homebrew formula in
# ethan03805/homebrew-tap (secret HOMEBREW_TAP_TOKEN). The procedure is
# docs/release-checklist.md.
#
# The minisign signature is required. cosign signing is on by default; set
# the repository variable SMCP_COSIGN to "false" to skip it.
#
# Platform installers (E-35, FR-20.23, FR-20.24): the installers job
# (installers.yml) builds the .deb, .rpm and macOS .pkg from the tag, all
# on Linux, and installs, exercises and removes the .deb and .rpm on
# Ubuntu and Fedora. The release job needs it, so a failed Linux smoke test
# publishes nothing; it then publishes exactly the tested .deb and .rpm
# (GoReleaser --skip=nfpm with the files in build/installers/) and lists
# them and the .pkg (build/installers-pending/) in the signed checksum
# file. The .pkg is smoke-tested on a macOS runner after that
# (smoke-macos, installers-macos-smoke.yml) so that a shortage of macOS
# runners cannot hold up the release, and the macos-pkg job uploads it
# only when that test passed, after checking its digest against the signed
# checksum file. A failed test leaves the .pkg off the release and opens
# an issue; a test that never ran opens an issue saying to re-run it
# (docs/ci.md, "macOS runners"; docs/release-checklist.md).
#
# Desktop Application installers (FR-20.17 to FR-20.19): the installers
# job also builds and smoke-tests the smcp-desktop .deb, .rpm and AppImage
# on Ubuntu, which block like the other Linux packages. The macOS .dmg can
# only be built on a Mac: the desktop-macos job (installers-desktop-
# macos.yml) builds and smoke-tests it before the release job. A failed
# build or test stops publication; no macOS runner is a warning, and the
# release is published without the .dmg. The smcp-desktop .msi for
# windows-amd64 and windows-arm64 (FR-20.20) is built, installed, started
# and removed on Windows runners by the installers job and blocks like the
# Linux packages.
#
# Windows (SRS FR-21.3, FR-21.24): the windows-scan job (windows-scan.yml)
# builds the Windows binaries as GoReleaser does and scans them with
# Microsoft Defender; the release job needs it, so a detection publishes
# nothing. After GoReleaser the release job checks that the binaries in
# the published zip archives have the scanned digests and adds the scan
# result and signature version to the release notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    name: installers
    uses: ./.github/workflows/installers.yml
    with:
      tag: ${{ github.ref_name }}
      macos-smoke: false
    permissions:
      contents: read

  desktop-macos:
    name: desktop-macos
    uses: ./.github/workflows/installers-desktop-macos.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  windows-scan:
    name: windows-scan
    uses: ./.github/workflows/windows-scan.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  release:
    name: release
    needs: [installers, desktop-macos, windows-scan]
    # desktop-macos succeeds when the .dmg passed or no macOS runner started
    # (outcome unavailable, a warning); it fails only when the build or its
    # smoke test failed, which stops publication (FR-20.24). A Defender
    # detection fails windows-scan, which also stops publication (FR-21.24).
    if: ${{ !cancelled() && needs.installers.result == 'success' && needs.desktop-macos.result == 'success' && needs.windows-scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: write # create the release and upload assets
      id-token: write # cosign keyless signing through GitHub OIDC
      actions: write # dispatch the tap workflow (FR-13.3); read the CI run of the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum
      - name: Test
        run: go test -race -short ./...
      - name: Release settings
        id: settings
        run: |
          prev=$(git tag -l 'v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ -d cmd/smcp-refserver ]; then echo "refserver=1" >> "$GITHUB_OUTPUT"; else echo "refserver=0" >> "$GITHUB_OUTPUT"; fi
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install minisign and the release signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::repository secret MINISIGN_SECRET_KEY is not set"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      # tools/provenance copies the license files of the npm packages bundled
      # into the console into THIRD_PARTY_NOTICES.txt (FR-12.8); the
      # console itself is the committed console/dist.
      - name: Install the console's production npm packages (license notices)
        working-directory: console
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      # The smoke-tested installers; GoReleaser lists them in the checksum
      # file and uploads them (checksum.extra_files, release.extra_files).
      # The macOS .pkg goes to build/installers-pending/: listed in the
      # checksum file, uploaded by the macos-pkg job once its macOS smoke
      # test passed.
      - name: Download the smoke-tested installers (FR-20.23, FR-20.24)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: build/installers
      - name: Hold back the .pkg until its macOS smoke test passes
        run: |
          mkdir -p build/installers-pending
          mv build/installers/*.pkg build/installers-pending/
          ls -l build/installers build/installers-pending
      # The ContextForge assets (FR-22.18, FR-22.21): the release lock and its
      # minisign signature, the SBOMs of the pinned image and wheel sets,
      # the ContextForge license and notice, the SPDX identifier check and
      # the advisory check of the pinned version. GoReleaser lists them in
      # the checksum file and uploads them (extra_files).
      - name: Install cosign (ContextForge image SBOM)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: ContextForge release assets (FR-22.18, FR-22.21)
        env:
          SMCP_RELEASE: "1"
          SMCP_VERSION: ${{ github.ref_name }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/contextforge-release-assets.sh build/contextforge | tee -a "$GITHUB_STEP_SUMMARY"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=nfpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.settings.outputs.previous }}
          SMCP_BUILD_REFSERVER: ${{ steps.settings.outputs.refserver }}
          SMCP_SBOM: "1"
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # Formula/smcp.rb in ethan03805/homebrew-tap; skipped when unset
          # and for a pre-release unless the variable SMCP_TAP_PRERELEASE
          # is "true".
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SMCP_TAP_PRERELEASE: ${{ vars.SMCP_TAP_PRERELEASE }}
      - name: Check the archive contents (FR-13.1)
        run: |
          version=${GITHUB_REF_NAME#v}
          for platform in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            a=build/dist/smcp_${version}_${platform}.tar.gz
            [ -f "$a" ] || { echo "::error::$a missing"; exit 1; }
            list=$(tar -tzf "$a")
            for f in smcpd smcpctl smcp-refserver smcp-session smcp-stdio smcp-connect smcp-workload README.md CHANGELOG.md LICENSE sbom.spdx.json \
              PROVENANCE.md THIRD_PARTY_NOTICES.txt .goreleaser.yaml scripts/release-sbom.sh go.mod go.sum console/package-lock.json; do
              printf '%s\n' "$list" | grep -qx "$f" || { echo "::error::$a lacks $f"; exit 1; }
            done
            echo "$a: $(printf '%s\n' "$list" | tr '\n' ' ')"
          done
          x=$(mktemp -d)
          tar -xzf "build/dist/smcp_${version}_linux_amd64.tar.gz" -C "$x"
          jq -e '.spdxVersion and (.packages | length > 10)' "$x/sbom.spdx.json" >/dev/null \
            || { echo "::error::sbom.spdx.json is not an SPDX document with packages"; exit 1; }
          # The six release binaries report the release version.
          for b in smcpd smcp-refserver smcp-session smcp-stdio smcp-connect; do
            out=$("$x/$b" --version 2>&1)
            echo "$b: $out"
            [ "$out" = "$b $version" ] || { echo "::error::$b --version printed '$out', not '$b $version'"; exit 1; }
          done
          out=$("$x/smcpctl" version --short)
          [ "$out" = "$version" ] || { echo "::error::smcpctl version --short printed '$out'"; exit 1; }
          grep -q "^| Source commit | \`$GITHUB_SHA\` |" "$x/PROVENANCE.md" || { echo "::error::PROVENANCE.md does not name commit $GITHUB_SHA"; exit 1; }
      - name: Download the Defender scan (FR-21.24)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: defender-scan
          path: build/defender
      - name: Check the Windows zip archives (FR-21.3) against the scanned binaries (FR-21.24)
        run: |
          version=${GITHUB_REF_NAME#v}
          sums=build/dist/smcp_${version}_checksums.txt
          # windows-scan writes its files with PowerShell on Windows (CRLF);
          # without the CR, grep -x matches the digest lines.
          sed -i 's/\r$//' build/defender/defender-sha256.txt build/defender/defender.md
          for arch in amd64 arm64; do
            a=smcp_${version}_windows_${arch}.zip
            [ -f "build/dist/$a" ] || { echo "::error::$a missing"; exit 1; }
            grep -q "  $a\$" "$sums" || { echo "::error::$a is not in $sums"; exit 1; }
            list=$(unzip -Z1 "build/dist/$a")
            for f in smcpd.exe smcpctl.exe smcp-refserver.exe smcp-session.exe smcp-stdio.exe smcp-connect.exe README.md CHANGELOG.md LICENSE sbom.spdx.json \
              PROVENANCE.md THIRD_PARTY_NOTICES.txt .goreleaser.yaml go.mod go.sum; do
              printf '%s\n' "$list" | grep -qx "$f" || { echo "::error::$a lacks $f"; exit 1; }
            done
            x=$(mktemp -d)
            unzip -q "build/dist/$a" -d "$x"
            for b in smcpd smcpctl smcp-refserver smcp-session smcp-stdio smcp-connect; do
              got=$(sha256sum "$x/$b.exe" | cut -d' ' -f1)
              grep -qx "$got  windows_$arch/$b.exe" build/defender/defender-sha256.txt \
                || { echo "::error::$a: $b.exe ($got) is not the binary Defender scanned; delete the release and investigate the build"; exit 1; }
            done
            echo "$a: contents and scanned digests match"
          done
      - name: Check that the checksum file lists every installer (FR-20.23)
        run: |
          version=${GITHUB_REF_NAME#v}
          sums=build/dist/smcp_${version}_checksums.txt
          n=0
          for f in build/installers/* build/installers-pending/*; do
            b=$(basename "$f")
            want=$(sha256sum "$f" | cut -d' ' -f1)
            grep -qx "$want  $b" "$sums" || { echo "::error::$b is not in $sums with digest $want"; exit 1; }
            n=$((n + 1))
          done
          # The Linux package file names write a pre-release 1.3.0-rc.1 as
          # 1.3.0.rc.1 (the package metadata keeps 1.3.0~rc.1;
          # .goreleaser.yaml, packaging/installers/desktop/build.sh).
          pv=$(printf '%s' "$version" | sed 's/-/./')
          for pattern in "smcp_${pv}_amd64.deb" "smcp_${pv}_arm64.deb" "smcp-${pv}-1.x86_64.rpm" "smcp-${pv}-1.aarch64.rpm" "smcp_${version}_darwin_arm64.pkg" \
            "smcp-desktop_${pv}_amd64.deb" "smcp-desktop_${pv}_arm64.deb" "smcp-desktop-${pv}-1.x86_64.rpm" "smcp-desktop-${pv}-1.aarch64.rpm" \
            "smcp-desktop_${version}_linux_amd64.AppImage" "smcp-desktop_${version}_linux_arm64.AppImage" "smcp-desktop_${version}_darwin_arm64.dmg" \
            "smcp_${version}_windows_amd64.msi" "smcp_${version}_windows_arm64.msi" \
            "smcp-desktop_${version}_windows_amd64.msi" "smcp-desktop_${version}_windows_arm64.msi"; do
            [ -f "build/installers/$pattern" ] || [ -f "build/installers-pending/$pattern" ] || echo "::warning::no installer named $pattern"
          done
          echo "$n installers listed in $sums" >> "$GITHUB_STEP_SUMMARY"
          # 7 command-line installers (.deb, .rpm, .pkg, .msi), 6 Linux
          # desktop installers and the 2 smcp-desktop .msi; the .dmg is the
          # 16th when a macOS runner built it.
          [ "$n" -ge 15 ] || { echo "::error::expected at least 15 installers, found $n"; exit 1; }
      # GitHub renames asset names with characters such as "~"; then
      # `sha256sum --check` on the downloaded release fails for those files.
      # The held-back .pkg (build/installers-pending/) is uploaded later by
      # the macos-pkg job under its name in the checksum file.
      - name: Check that every name in the checksum file is a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sums=build/dist/smcp_${GITHUB_REF_NAME#v}_checksums.txt
          assets=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for name in $(awk '{print $2}' "$sums") "$(basename "$sums")" "$(basename "$sums").minisig"; do
            if [ -f "build/installers-pending/$name" ]; then
              printf '%s\n' "$name" | grep -Eqx '[A-Za-z0-9_-]([A-Za-z0-9._-]*[A-Za-z0-9_-])?' \
                || { echo "::error::$name (checksum file) is not a valid GitHub release asset name"; exit 1; }
              continue
            fi
            printf '%s\n' "$assets" | grep -qxF "$name" || { echo "::error::$name (checksum file) is not an asset of release $GITHUB_REF_NAME"; exit 1; }
          done
      # FR-12.1: every package of the SBOM in the archives and of the
      # per-archive SBOMs has an OSI-approved or public-domain license, or a
      # reviewed exception in packaging/sbom-review.json.
      - name: Check the SBOM licenses (FR-12.1)
        run: |
          set -o pipefail
          x=$(mktemp -d)
          tar -xzf "build/dist/smcp_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" -C "$x" sbom.spdx.json
          go run ./tools/sbomcheck -review packaging/sbom-review.json "$x/sbom.spdx.json" build/dist/*.sbom.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the minisign signature against SECURITY.md
        run: |
          rm -f "$MINISIGN_KEY_FILE"
          key=$(sed -n 's/^PUBKEY="\(.*\)"$/\1/p' install.sh)
          grep -qF "$key" SECURITY.md || { echo "::error::install.sh and SECURITY.md publish different keys"; exit 1; }
          sums=$(ls build/dist/*_checksums.txt)
          minisign -V -P "$key" -m "$sums" -x "$sums.minisig"
      # FR-19.3: "enforced" only when every Appendix M scenario passed in the
      # Enforced profile for this commit; "not enforced" otherwise, including
      # when the status data is for another commit. The status data is the
      # document the CI status job published to site-data when it is for
      # this commit, and otherwise the status-document artifact of the CI
      # run that this tag push started (ci.yml runs the Enforced jobs on v*
      # tags); the step waits up to 70 minutes for that run to complete.
      - name: Release label (FR-19.3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          echo '{}' > build/release-status.json
          if git fetch --quiet --depth=1 origin refs/heads/site-data 2>/dev/null && git show FETCH_HEAD:status.json > build/site-status.json 2>/dev/null &&
             [ "$(jq -r .commit build/site-status.json)" = "$GITHUB_SHA" ]; then
            cp build/site-status.json build/release-status.json
            echo "the site-data status data is for this commit"
          else
            run=""
            for _ in $(seq 1 140); do
              run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 20 \
                --json databaseId,status,headBranch \
                -q "[.[] | select(.headBranch == \"$GITHUB_REF_NAME\" and .status == \"completed\")][0].databaseId // empty" || true)
              [ -n "$run" ] && break
              sleep 30
            done
            if [ -n "$run" ] && gh run download "$run" -R "$GITHUB_REPOSITORY" -n status-document -D build/ci-status; then
              cp build/ci-status/status.json build/release-status.json
              echo "status data of CI run $run for commit $(jq -r .commit build/release-status.json)"
            else
              echo "::warning::no status data for this commit (CI run of the tag: ${run:-not completed}); the release is labelled not enforced"
            fi
          fi
          go run ./tools/reqreport label -status build/release-status.json -commit "$GITHUB_SHA" -out build/release-label.md
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body > build/release-notes.md
          { echo; cat build/release-label.md; } >> build/release-notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file build/release-notes.md
          gh release upload "$GITHUB_REF_NAME" build/release-label.md -R "$GITHUB_REPOSITORY" --clobber
          cat build/release-label.md >> "$GITHUB_STEP_SUMMARY"
      - name: Defender result in the release notes (FR-21.24)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body > build/release-notes.md
          { echo; cat build/defender/defender.md; } >> build/release-notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file build/release-notes.md
      - name: Install cosign
        if: vars.SMCP_COSIGN != 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksum file (keyless) and upload the bundle
        if: vars.SMCP_COSIGN != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sums=$(ls build/dist/*_checksums.txt)
          cosign sign-blob --yes --bundle "$sums.sigstore.json" "$sums"
          gh release upload "$GITHUB_REF_NAME" "$sums.sigstore.json" -R "$GITHUB_REPOSITORY" --clobber
          {
            echo "Verify the checksum file:"
            echo '```'
            echo "cosign verify-blob --bundle $(basename "$sums").sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com $(basename "$sums")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the Homebrew tap check (FR-13.3)
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
          TAP_PRERELEASE: ${{ vars.SMCP_TAP_PRERELEASE }}
        run: |
          # GoReleaser treats a tag with a "-" suffix as a pre-release.
          case "$GITHUB_REF_NAME" in *-*) pre=1 ;; *) pre=0 ;; esac
          if [ "$HAS_TAP_TOKEN" != true ]; then echo "HOMEBREW_TAP_TOKEN is not set; no formula was pushed"; exit 0; fi
          if [ "$pre" = 1 ] && [ "$TAP_PRERELEASE" != true ]; then echo "pre-release: no formula was pushed"; exit 0; fi
          gh workflow run tap.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
          echo "Started the tap workflow for $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  # The .pkg on a real Mac, after the release is published; never blocks
  # (installers-macos-smoke.yml: outcome passed, unavailable or failed).
  smoke-macos:
    name: smoke-macos
    needs: [installers, release]
    uses: ./.github/workflows/installers-macos-smoke.yml
    with:
      version: ${{ needs.installers.outputs.version }}
    permissions:
      contents: read

  # Uploads the .pkg when its smoke test passed: the artifact's digest must
  # be the one in the published, minisign-signed checksum file. Otherwise
  # it opens an issue; a real failure also fails this job and adds a note
  # to the release.
  macos-pkg:
    name: macos-pkg
    needs: [installers, release, smoke-macos]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload the .pkg, edit the release notes
      issues: write # report a failed or missing smoke test
    env:
      GH_TOKEN: ${{ github.token }}
      OUTCOME: ${{ needs.smoke-macos.outputs.outcome }}
      VERSION: ${{ needs.installers.outputs.version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-macos
          path: build/pkg
      - name: Upload the tested .pkg, or report
        run: |
          pkg=smcp_${VERSION}_darwin_arm64.pkg
          issue() { # <title> <body>
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$1\" in:title" --json number -q '.[0].number // empty')
            if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "$2"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$1" --body "$2"; fi
          }
          case "$OUTCOME" in
            passed)
              sudo apt-get update -qq && sudo apt-get install -y -qq minisign >/dev/null
              sums=smcp_${VERSION}_checksums.txt
              gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "$sums" -p "$sums.minisig" -D build/sums
              key=$(sed -n 's/^PUBKEY="\(.*\)"$/\1/p' install.sh)
              minisign -V -P "$key" -m "build/sums/$sums" -x "build/sums/$sums.minisig"
              want=$(sha256sum "build/pkg/$pkg" | cut -d' ' -f1)
              grep -qx "$want  $pkg" "build/sums/$sums" || { echo "::error::$pkg (sha256 $want) is not the file in the signed $sums"; exit 1; }
              if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "$pkg"; then
                echo "$pkg is already on the release"
              else
                gh release upload "$GITHUB_REF_NAME" "build/pkg/$pkg" -R "$GITHUB_REPOSITORY"
              fi
              echo "Uploaded $pkg (sha256 $want, in the signed checksum file) after its macOS smoke test passed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            unavailable)
              issue "$GITHUB_REF_NAME: macOS .pkg not published yet (smoke test did not run)" \
                "No macOS runner ran the .pkg smoke test of $GITHUB_REF_NAME ($RUN_URL), so \`$pkg\` is not on the release yet; it is listed in the signed checksum file. Re-run the job **smoke-macos / smoke pkg (arm64)** of that run (the job's re-run button, or \`gh run rerun <run id> --job <job id>\`); its dependent jobs re-run with it and upload the .pkg when the test passes (docs/release-checklist.md)."
              echo "::warning::the macOS smoke test did not run; $pkg is not uploaded (issue opened)"
              ;;
            *)
              issue "$GITHUB_REF_NAME: macOS .pkg smoke test failed" \
                "The macOS .pkg smoke test of $GITHUB_REF_NAME failed ($RUN_URL; outcome '${OUTCOME:-unknown}'). \`$pkg\` was not uploaded to the release. Fix the package and publish a new release; see docs/release-checklist.md."
              gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body > build/notes.md
              printf '\n\n**macOS .pkg withheld:** its smoke test on macOS failed (%s). Install on macOS with install.sh or the darwin archive.\n' "$RUN_URL" >> build/notes.md
              gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file build/notes.md
              echo "::error::the macOS smoke test failed; $pkg is not uploaded (issue opened, release notes marked)"
              exit 1
              ;;
          esac
