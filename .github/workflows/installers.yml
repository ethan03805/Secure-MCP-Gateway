# Platform installers (E-35; SRS FR-20.17, FR-20.18, FR-20.21 to FR-20.24,
# FR-20.26, SR-4.11-2): builds the Linux .deb and .rpm packages `smcp`
# (GoReleaser nFPM) and the macOS command-line .pkg, then installs,
# exercises and removes each one on a runner of its platform with
# scripts/package-smoke.sh.
#
# Every package is built on Linux, the .pkg too: build-macos runs
# packaging/installers/macos/build-pkg-linux.sh (xar, bomutils and
# rcodesign; the package build-pkg.sh makes with pkgbuild on macOS). Only
# the .pkg smoke test needs a macOS runner, and it does not block: it is
# the reusable workflow installers-macos-smoke.yml, which fails the run on
# a real test failure and only warns when no macOS runner picked the job
# up (docs/ci.md, "macOS runners").
#
# A reusable workflow with two callers:
#   - ci.yml, job installers, behind the changes job (docs/ci.md), with no
#     tag: snapshot packages. macos-smoke says whether the .pkg smoke test
#     runs: always on pushes to main, on pull requests only when the macOS
#     package can change. Not a required check.
#   - release.yml, job installers, with the release tag and macos-smoke
#     false: the release job needs it, downloads the artifacts
#     installers-linux and installers-macos, publishes the .deb and .rpm
#     files and lists them and the .pkg in the signed checksum file
#     (FR-20.23). A failed Linux smoke test stops the release before
#     anything is published (FR-20.24). release.yml then smoke-tests the
#     .pkg on macOS and uploads it only when that test passed.
#
# The Desktop Application installers (FR-20.17 to FR-20.19): on Ubuntu
# amd64 and arm64 the smcp-desktop .deb and .rpm (depending on smcp of the
# same version, from the Gateway binaries of the smcp .deb) and the
# AppImage, built by packaging/installers/desktop/build.sh and installed
# and started by scripts/desktop-smoke.sh; they block like the other Linux
# packages. The macOS .dmg needs a macOS runner (Tauri links WebKit and
# AppKit): installers-desktop-macos.yml builds and smoke-tests it and,
# like the .pkg smoke test, does not block when no runner starts. The
# Windows .msi is built elsewhere.
name: installers

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v1.3.0); empty builds snapshot packages
        type: string
        default: ""
      macos-smoke:
        description: Install the .pkg on a macOS runner (installers-macos-smoke.yml)
        type: boolean
        default: true
      break:
        description: >-
          "deb" changes one byte of the amd64 .deb after it is built, so that
          its smoke test fails (installers-broken.yml checks that this stops
          publication, FR-20.24). Empty for every real build.
        type: string
        default: ""
    outputs:
      version:
        description: Version of the packages
        value: ${{ jobs.build-linux.outputs.version }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  GORELEASER_VERSION: v2.18.2
  NODE_VERSION: "24"
  RUST_VERSION: "1.94.0"
  CARGO_TERM_COLOR: never

jobs:
  build-linux:
    name: build .deb and .rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Install syft (SBOM in /usr/share/doc/smcp)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # As in release.yml: the notices of a release copy the console's npm
      # license files (FR-12.8).
      - name: Install the console's production npm packages (license notices)
        if: inputs.tag != ''
        working-directory: console
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: GoReleaser (nFPM packages only)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish,sign,homebrew,archive,sbom,announce ${{ inputs.tag == '' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          SMCP_BUILD_REFSERVER: "1"
          SMCP_SBOM: ${{ inputs.tag != '' && '1' || '' }}
      - name: Deliberately break the amd64 .deb (stop test)
        if: inputs.break == 'deb'
        run: |
          [ -z "$TAG" ] || { echo "::error::a release build is never broken on purpose"; exit 1; }
          f=$(ls build/dist/smcp_*_amd64.deb)
          size=$(wc -c < "$f")
          printf 'broken' | dd of="$f" bs=1 seek=$((size / 2)) conv=notrunc 2>/dev/null
          echo "::warning::$f was changed on purpose; its smoke test must fail"
        env:
          TAG: ${{ inputs.tag }}
      - name: Version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(jq -r .version build/dist/metadata.json)
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then echo "::error::packages have version $version, not ${TAG#v}"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l build/dist/*.deb build/dist/*.rpm
          n=$(find build/dist -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')
          [ "$n" = 4 ] || { echo "::error::expected 4 packages (deb and rpm, amd64 and arm64), found $n"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-linux
          path: |
            build/dist/*.deb
            build/dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  # The macOS .pkg, built on Linux (no macOS runner): GoReleaser
  # cross-compiles the darwin-arm64 binaries; build-pkg-linux.sh signs them
  # ad hoc with rcodesign and writes the flat package with xar and
  # bomutils, all pinned by scripts/install-pkg-tools.sh.
  build-macos:
    name: build .pkg
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Install syft (SBOM in /usr/local/share/doc/smcp)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install the console's production npm packages (license notices)
        if: inputs.tag != ''
        working-directory: console
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Package tools cache (xar, bomutils, rcodesign)
        id: pkgtools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pkgtools
          key: pkgtools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-pkg-tools.sh') }}
      - name: Build the package tools (pinned commits and digests)
        env:
          CACHED: ${{ steps.pkgtools.outputs.cache-hit }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf automake libtool libxml2-dev libssl-dev zlib1g-dev libbz2-dev file >/dev/null
          if [ "$CACHED" != true ]; then bash scripts/install-pkg-tools.sh "$RUNNER_TEMP/pkgtools"; fi
          echo "$RUNNER_TEMP/pkgtools/bin" >> "$GITHUB_PATH"
      - name: GoReleaser (darwin-arm64 binaries)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: build --clean --single-target ${{ inputs.tag == '' && '--snapshot' || '' }}
        env:
          # GGOOS/GGOARCH pick the --single-target platform without also
          # cross-compiling the before hooks (go run ./tools/provenance).
          GGOOS: darwin
          GGOARCH: arm64
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          SMCP_BUILD_REFSERVER: "1"
          SMCP_SBOM: ${{ inputs.tag != '' && '1' || '' }}
      - name: Build the .pkg (build-pkg-linux.sh)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(jq -r .version build/dist/metadata.json)
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then echo "::error::binaries have version $version, not ${TAG#v}"; exit 1; fi
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) bash packaging/installers/macos/build-pkg-linux.sh "$version" build/dist build/installers
          xar -t -f build/installers/*.pkg
          sha256sum build/installers/*.pkg | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-macos
          path: build/installers/*.pkg
          if-no-files-found: error
          retention-days: 14

  smoke-linux:
    name: smoke ${{ matrix.format }} (${{ matrix.arch }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, arch: amd64, runner: ubuntu-24.04, file: "smcp_*_amd64.deb" }
          - { format: deb, arch: arm64, runner: ubuntu-24.04-arm, file: "smcp_*_arm64.deb" }
          - { format: rpm, arch: amd64, runner: ubuntu-24.04, file: "smcp-*.x86_64.rpm" }
          - { format: rpm, arch: arm64, runner: ubuntu-24.04-arm, file: "smcp-*.aarch64.rpm" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-linux
          path: build/installers
      # Broken-installer stop test (FR-20.24): a truncated and an altered
      # copy are refused by the package manager and stop package-smoke.sh.
      - name: Broken copies of the .deb are refused
        if: matrix.format == 'deb'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          bash scripts/package-broken.sh "$1" "$VERSION"
      - name: Broken copies of the .rpm are refused (Fedora container)
        if: matrix.format == 'rpm'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          docker run --rm -v "$PWD:/w:ro" -w /w -e VERSION -e PKG="$1" fedora:44 bash -c \
            'dnf install -y -q procps-ng util-linux shadow-utils findutils >/dev/null && bash scripts/package-broken.sh "$PKG" "$VERSION"'
      # Upgrade through install.sh --package: the new package is verified
      # against the signed checksum file before apt sees it; an altered
      # package or another key's signature leaves the old version installed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.format == 'deb'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: go.sum
      - name: Upgrade with install.sh --package (TestInstallScriptPackageUpgradeOnHost)
        if: matrix.format == 'deb'
        env:
          SMCP_PACKAGE_UPGRADE_TEST: "1"
          SMCP_UPGRADE_VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          SMCP_UPGRADE_DEB="$PWD/$1" go test -count=1 -v -run '^TestInstallScriptPackageUpgradeOnHost$' ./tools/installsh/
      # Ubuntu: on the runner itself, with systemd, so that removal of the
      # system smcpd service is exercised (FR-20.22).
      - name: Install, exercise and remove the .deb
        if: matrix.format == 'deb'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          bash scripts/package-smoke.sh "$1" "$VERSION"
      # Fedora: in a container, as root; the script does the user's part as
      # an unprivileged user. No systemd, so the service check is skipped.
      - name: Install, exercise and remove the .rpm (Fedora container)
        if: matrix.format == 'rpm'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          docker run --rm -v "$PWD:/w:ro" -w /w -e VERSION -e PKG="$1" fedora:44 bash -c \
            'dnf install -y -q procps-ng util-linux shadow-utils findutils >/dev/null && bash scripts/package-smoke.sh "$PKG" "$VERSION"'

  # The .pkg installed on a real Mac; does not block (a runner that never
  # starts is a warning, a failed test fails the run). The release runs
  # installers-macos-smoke.yml itself, after publishing (release.yml).
  smoke-macos:
    name: smoke pkg
    needs: [build-linux, build-macos]
    if: inputs.macos-smoke
    uses: ./.github/workflows/installers-macos-smoke.yml
    with:
      version: ${{ needs.build-linux.outputs.version }}
    permissions:
      contents: read

  # smcp-desktop .deb and .rpm and the AppImage, on a runner of each
  # architecture, from the Gateway binaries of the smcp .deb of this build.
  build-desktop-linux:
    name: build desktop .deb, .rpm and AppImage (${{ matrix.arch }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: WebKitGTK, tray and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev rpm file libfuse2t64 >/dev/null
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-linux
          path: build/installers
      - name: Build (packaging/installers/desktop/build.sh)
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          deb=$(ls build/installers/smcp_*_"$ARCH".deb)
          case "$ARCH" in amd64) rpm=$(ls build/installers/smcp-*.x86_64.rpm) ;; arm64) rpm=$(ls build/installers/smcp-*.aarch64.rpm) ;; esac
          dpkg-deb -x "$deb" "$RUNNER_TEMP/smcp"
          bash packaging/installers/desktop/build.sh "$VERSION" "$RUNNER_TEMP/smcp/usr/bin" build/desktop "$deb" "$rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-desktop-linux-${{ matrix.arch }}
          path: |
            build/desktop/*.deb
            build/desktop/*.rpm
            build/desktop/*.AppImage
          if-no-files-found: error
          retention-days: 14

  smoke-desktop-linux:
    name: smoke desktop ${{ matrix.format }} (${{ matrix.arch }})
    needs: [build-linux, build-desktop-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: deb, arch: amd64, runner: ubuntu-24.04, file: "smcp-desktop_*_amd64.deb", smcp: "smcp_*_amd64.deb" }
          - { format: deb, arch: arm64, runner: ubuntu-24.04-arm, file: "smcp-desktop_*_arm64.deb", smcp: "smcp_*_arm64.deb" }
          - { format: rpm, arch: amd64, runner: ubuntu-24.04, file: "smcp-desktop-*.x86_64.rpm", smcp: "smcp-*.x86_64.rpm" }
          - { format: rpm, arch: arm64, runner: ubuntu-24.04-arm, file: "smcp-desktop-*.aarch64.rpm", smcp: "smcp-*.aarch64.rpm" }
          - { format: AppImage, arch: amd64, runner: ubuntu-24.04, file: "smcp-desktop_*_linux_amd64.AppImage", smcp: "" }
          - { format: AppImage, arch: arm64, runner: ubuntu-24.04-arm, file: "smcp-desktop_*_linux_arm64.AppImage", smcp: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*linux*
          merge-multiple: true
          path: build/installers
      - name: Xvfb (Ubuntu)
        if: matrix.format != 'rpm'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libegl1 libgles2 libgl1-mesa-dri >/dev/null
      - name: Install, start and remove (Ubuntu)
        if: matrix.format != 'rpm'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
          SMCP: ${{ matrix.smcp }}
        run: |
          # shellcheck disable=SC2086 # FILE and SMCP are globs
          set -- build/installers/$FILE
          # shellcheck disable=SC2086
          if [ -n "$SMCP" ]; then set -- "$1" build/installers/$SMCP; fi
          bash scripts/desktop-smoke.sh "$1" "$VERSION" ${2:+"$2"}
      # FR-20.19: the AppImage on a distribution without .deb or .rpm
      # tooling (Arch Linux; its image exists for amd64 only). gtk3 stands
      # for a graphical desktop: like every AppImage, this one uses the
      # host's base libraries (fribidi, fontconfig, GL), which a bare
      # container lacks.
      - name: AppImage on Arch Linux (no dpkg, no rpm)
        if: matrix.format == 'AppImage' && matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          # shellcheck disable=SC2086 # FILE is a glob
          set -- build/installers/$FILE
          docker run --rm -v "$PWD:/w:ro" -w /w -e VERSION -e PKG="$1" archlinux:latest bash -c \
            'pacman -Sy --noconfirm --quiet xorg-server-xvfb xorg-xauth which libglvnd mesa gtk3 >/dev/null && ! command -v dpkg && ! command -v rpm && bash scripts/desktop-smoke.sh "$PKG" "$VERSION"'
      - name: Install, start and remove (Fedora container)
        if: matrix.format == 'rpm'
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
          FILE: ${{ matrix.file }}
          SMCP: ${{ matrix.smcp }}
        run: |
          # shellcheck disable=SC2086 # FILE and SMCP are globs
          set -- build/installers/$FILE build/installers/$SMCP
          docker run --rm -v "$PWD:/w:ro" -w /w -e VERSION -e PKG="$1" -e SMCP_PKG="$2" fedora:44 bash -c \
            'dnf install -y -q procps-ng findutils >/dev/null && bash scripts/desktop-smoke.sh "$PKG" "$VERSION" "$SMCP_PKG"'

  # The macOS .dmg, built and started on a Mac; does not block (as
  # smoke-macos). The release runs installers-desktop-macos.yml itself.
  desktop-macos:
    name: desktop .dmg
    if: inputs.macos-smoke
    uses: ./.github/workflows/installers-desktop-macos.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: read
